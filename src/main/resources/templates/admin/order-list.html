<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Quản lý Đơn hàng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" th:href="@{/css/readability.css}">
<link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/admin.js}"></script><th:block th:replace="~{layout/page-transition :: transition}"></th:block>
</head>
<body class="admin-page bg-light">

<div th:replace="~{layout/admin-navbar :: admin-navbar}"></div>

<div class="container py-4 admin-main"><header class="admin-page-heading"><div class="admin-page-heading-icon" aria-hidden="true"><i class="bi bi-receipt"></i></div><div><h1>Đơn hàng & giao dịch</h1><p>Theo dõi thanh toán và xử lý đơn hàng.</p></div></header>
    <div class="d-flex justify-content-between align-items-center mb-4">

        <a th:href="@{/admin/orders/export}" class="btn btn-success fw-bold">
            <i class="bi bi-file-earmark-excel me-1"></i> Xuất Excel
        </a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
            <div class="table-responsive">
                <table id="orderTable" data-name-filter="true" class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Mã Đơn</th>
                            <th>Khóa học</th>
                            <th>Học viên</th>
                            <th>Số tiền</th>
                            <th>Ngày tạo</th>
                            <th>Trạng thái</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}" th:attr="data-student-name=${order.user != null ? (order.user.username ?: '') + ' ' + (order.user.fullName ?: '') : ''}">
                            <td><span class="fw-semibold font-monospace" th:text="${order.orderCode}"></span></td>
                            <td th:text="${order.course != null ? order.course.title : 'N/A'}"></td>
                            <td>
                                <span th:text="${order.user != null ? order.user.username : 'N/A'}"></span><br>
                                <small class="text-muted" th:text="${order.user != null ? order.user.email : ''}"></small>
                            </td>
                            <td class="fw-bold text-success" th:text="${order.amount != null ? #numbers.formatDecimal(order.amount, 1, 'COMMA', 0, 'POINT') + ' ₫' : '0 ₫'}"></td>
                            <td th:text="${order.createdAt != null ? #temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm') : ''}"></td>
                            <td>
                                <span th:if="${order.status == 'PAID'}" class="badge bg-success">Đã thanh toán</span>
                                <span th:if="${order.status == 'PENDING'}" class="badge bg-warning text-dark">Chờ thanh toán</span>
                                <span th:if="${order.status == 'FAILED'}" class="badge bg-danger">Thất bại</span>
                                <span th:if="${order.status == 'REFUNDED'}" class="badge bg-secondary">Đã hoàn tiền</span>
                                <span th:if="${order.status == 'CANCELLED'}" class="badge bg-secondary">Đã hủy</span>
                            </td>
                            <td class="text-end">
                                <div class="d-flex justify-content-end gap-2">
                                    <form th:if="${order.status == 'PENDING'}" th:action="@{/admin/orders/{id}/manual-confirm(id=${order.id})}" method="post" onsubmit="return confirm('Xác nhận đã nhận tiền mặt/chuyển khoản cho đơn hàng này? Khóa học sẽ được mở cho học viên.');">
                                        <button type="submit" class="btn btn-sm btn-outline-success" title="Xác nhận thủ công">
                                            <i class="bi bi-check-circle"></i>
                                        </button>
                                    </form>
                                    <form th:if="${order.status == 'PAID'}" th:action="@{/admin/orders/{id}/revoke(id=${order.id})}" method="post" onsubmit="return confirm('CẢNH BÁO: Thu hồi khóa học này? Học viên sẽ không thể truy cập khóa học nữa.');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Thu hồi khóa học">
                                            <i class="bi bi-x-octagon"></i>
                                        </button>
                                    </form>
                                    <span th:if="${order.status != 'PENDING' and order.status != 'PAID'}" class="text-muted"><i class="bi bi-dash"></i></span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
</body>
</html>
