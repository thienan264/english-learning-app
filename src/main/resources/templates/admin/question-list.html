<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ngân hàng Câu hỏi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <a th:href="@{'/admin/courses/' + ${lesson.course.id} + '/lessons'}" class="btn btn-secondary mb-3">&larr; Quay lại danh sách Bài học</a>
        
        <h3 class="mb-4">Bài học: <span class="text-primary" th:text="${lesson.title}"></span></h3>

        <div class="row">
            <div class="col-md-5">
                <div class="card shadow border-primary">
                    <div class="card-header bg-primary text-white">Thêm Câu Hỏi Trắc Nghiệm</div>
                    <div class="card-body">
                        <form th:action="@{'/admin/lessons/' + ${lesson.id} + '/questions/add-multiple-choice'}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nội dung câu hỏi</label>
                                <textarea name="questionText" class="form-control" rows="2" required></textarea>
                            </div>
                            
                            <hr>
                            <label class="form-label fw-bold">Các lựa chọn đáp án (Chọn vào ô tròn để đánh dấu đáp án đúng)</label>
                            
                            <!-- Đáp án A -->
                            <div class="input-group mb-2">
                                <div class="input-group-text">
                                    <input type="radio" name="correctIndex" value="0" required>
                                </div>
                                <span class="input-group-text">A</span>
                                <input type="text" name="ans0" class="form-control" required>
                            </div>
                            <!-- Đáp án B -->
                            <div class="input-group mb-2">
                                <div class="input-group-text">
                                    <input type="radio" name="correctIndex" value="1">
                                </div>
                                <span class="input-group-text">B</span>
                                <input type="text" name="ans1" class="form-control" required>
                            </div>
                            <!-- Đáp án C -->
                            <div class="input-group mb-2">
                                <div class="input-group-text">
                                    <input type="radio" name="correctIndex" value="2">
                                </div>
                                <span class="input-group-text">C</span>
                                <input type="text" name="ans2" class="form-control" required>
                            </div>
                            <!-- Đáp án D -->
                            <div class="input-group mb-3">
                                <div class="input-group-text">
                                    <input type="radio" name="correctIndex" value="3">
                                </div>
                                <span class="input-group-text">D</span>
                                <input type="text" name="ans3" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Giải thích (Tùy chọn)</label>
                                <textarea name="explanation" class="form-control" rows="2"></textarea>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Lưu câu hỏi</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">Danh sách Câu hỏi đã tạo</div>
                    <div class="card-body">
                        <div th:each="q, iterStat : ${questions}" class="mb-4 border-bottom pb-3">
                            <h6 class="fw-bold">
                                Câu <span th:text="${iterStat.count}"></span>: <span th:text="${q.questionText}"></span>
                            </h6>
                            <ul class="list-unstyled ms-3">
                                <!-- Lặp để in ra các đáp án, tô màu xanh lá cho đáp án đúng -->
                                <li th:each="a : ${q.answers}" th:classappend="${a.isCorrect} ? 'text-success fw-bold' : ''">
                                    <span th:if="${a.isCorrect}">&#10003;</span>
                                    <span th:unless="${a.isCorrect}">&#8226;</span>
                                    <span th:text="${a.answerText}"></span>
                                </li>
                            </ul>
                            <div th:if="${q.explanation != null and q.explanation != ''}" class="alert alert-info py-1 px-2 mt-2" style="font-size: 0.9em;">
                                <strong>Giải thích:</strong> <span th:text="${q.explanation}"></span>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(questions)}" class="text-center text-muted">
                            Chưa có câu hỏi nào trong bài học này.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
