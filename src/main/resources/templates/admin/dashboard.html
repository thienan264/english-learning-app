<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Thanh điều hướng (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">English Learning Admin</a>
            <div class="d-flex">
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-outline-light" type="submit">Đăng xuất</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h2 class="mb-4">Bảng điều khiển (Dashboard)</h2>
                <div class="card shadow">
                    <div class="card-body">
                        <h5 class="card-title">Chào mừng Quản trị viên!</h5>
                        <p class="card-text">Tại đây bạn có thể quản lý các khóa học, bài học và ngân hàng câu hỏi. Các chức năng này sẽ được phát triển trong bước tiếp theo.</p>
                        <a href="/admin/courses" class="btn btn-primary">Quản lý Khóa học</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
