<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Ngân hàng Đề thi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link rel="stylesheet" th:href="@{/css/readability.css}">
<link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/admin.js}"></script><th:block th:replace="~{layout/page-transition :: transition}"></th:block>
</head>
<body class="admin-page bg-light">
    <div th:replace="~{layout/admin-navbar :: admin-navbar}"></div>

    <div class="container mt-4 mb-5 admin-main"><header class="admin-page-heading"><div class="admin-page-heading-icon" aria-hidden="true"><i class="bi bi-collection"></i></div><div><h1>Ngân hàng đề thi</h1><p>Quản lý đề thi theo từng khóa học.</p></div></header>

        <p class="text-muted mb-4">Chọn một khóa học bên dưới để xem và soạn thảo các đề thi kỹ năng (Mock Test) thuộc khóa học đó.</p>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="course : ${courses}">
                <div class="card h-100 shadow-sm border-0">
                    <div class="d-flex justify-content-center align-items-center bg-light rounded-top" style="height: 180px; overflow: hidden;">
                        <img th:if="${course.thumbnailUrl != null and !course.thumbnailUrl.isEmpty()}" th:src="${course.thumbnailUrl}" onerror="this.onerror=null; this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22400%22%20height%3D%22200%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20400%20200%22%20preserveAspectRatio%3D%22none%22%3E%3Crect%20width%3D%22400%22%20height%3D%22200%22%20fill%3D%22%23e9ecef%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20fill%3D%22%236c757d%22%20dy%3D%22.3em%22%20text-anchor%3D%22middle%22%20font-family%3D%22sans-serif%22%20font-size%3D%2220%22%3ENo%20Image%3C%2Ftext%3E%3C%2Fsvg%3E';" class="card-img-top w-100 h-100" style="object-fit: cover;">
                        <img th:unless="${course.thumbnailUrl != null and !course.thumbnailUrl.isEmpty()}" src="data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22400%22%20height%3D%22200%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20400%20200%22%20preserveAspectRatio%3D%22none%22%3E%3Crect%20width%3D%22400%22%20height%3D%22200%22%20fill%3D%22%23e9ecef%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20fill%3D%22%236c757d%22%20dy%3D%22.3em%22%20text-anchor%3D%22middle%22%20font-family%3D%22sans-serif%22%20font-size%3D%2220%22%3ENo%20Image%3C%2Ftext%3E%3C%2Fsvg%3E" class="card-img-top w-100 h-100" style="object-fit: cover;">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-primary" th:text="${course.title}"></h5>
                        <p class="card-text text-muted small" th:text="${course.description}"></p>
                    </div>
                    <div class="card-footer bg-white border-top-0 pb-3 text-end">
                        <a th:href="@{'/admin/exams/course/' + ${course.id}}" class="btn btn-primary w-100">
                            <i class="bi bi-folder2-open"></i> Xem các Đề thi
                        </a>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(courses)}" class="col-12 text-center text-muted p-5">
                Chưa có khóa học nào. Hãy tạo khóa học trước.
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
