<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ngân hàng Đề thi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div th:replace="~{layout/admin-navbar :: admin-navbar}"></div>

    <div class="container mt-4 mb-5">
        <h2 class="fw-bold mb-4">📚 Ngân hàng Đề thi theo Khóa học</h2>
        <p class="text-muted mb-4">Chọn một khóa học bên dưới để xem và soạn thảo các đề thi kỹ năng (Mock Test) thuộc khóa học đó.</p>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="course : ${courses}">
                <div class="card h-100 shadow-sm border-0">
                    <img th:if="${course.thumbnailUrl != null}" th:src="${course.thumbnailUrl}" class="card-img-top" style="height: 180px; object-fit: cover;">
                    <img th:if="${course.thumbnailUrl == null}" src="https://via.placeholder.com/400x200?text=Course+Image" class="card-img-top" style="height: 180px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-primary" th:text="${course.title}"></h5>
                        <p class="card-text text-muted small" th:text="${course.description}"></p>
                    </div>
                    <div class="card-footer bg-white border-top-0 pb-3 text-end">
                        <a th:href="@{'/admin/exams/course/' + ${course.id}}" class="btn btn-primary w-100">
                            <i class="bi bi-folder2-open"></i> Xem các Đề thi
                        </a>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(courses)}" class="col-12 text-center text-muted p-5">
                Chưa có khóa học nào. Hãy tạo khóa học trước.
            </div>
        </div>
    </div>
</body>
</html>
