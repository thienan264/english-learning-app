<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Tư Vấn - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div th:replace="~{layout/admin-navbar :: navbar}"></div>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="bi bi-headset text-primary me-2"></i>Quản lý Yêu cầu Tư Vấn</h2>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="py-3 px-4">Ngày đăng ký</th>
                                <th class="py-3 px-4">Họ tên</th>
                                <th class="py-3 px-4">Số điện thoại</th>
                                <th class="py-3 px-4">Khu vực</th>
                                <th class="py-3 px-4">Môn học</th>
                                <th class="py-3 px-4">Trạng thái</th>
                                <th class="py-3 px-4 text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(advisories)}">
                                <td colspan="7" class="text-center py-5 text-muted">Chưa có yêu cầu tư vấn nào.</td>
                            </tr>
                            <tr th:each="adv : ${advisories}">
                                <td class="px-4" th:text="${#temporals.format(adv.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="px-4 fw-bold" th:text="${adv.fullName}"></td>
                                <td class="px-4">
                                    <a th:href="'tel:' + ${adv.phone}" class="text-decoration-none fw-bold text-primary" th:text="${adv.phone}"></a>
                                </td>
                                <td class="px-4" th:text="${adv.area}"></td>
                                <td class="px-4">
                                    <span class="badge bg-info text-dark" th:text="${adv.subject}"></span>
                                </td>
                                <td class="px-4">
                                    <span class="badge bg-warning text-dark" th:if="${adv.status == 'PENDING'}">Chưa gọi</span>
                                    <span class="badge bg-success" th:if="${adv.status == 'CONTACTED'}">Đã liên hệ</span>
                                    <span class="badge bg-secondary" th:if="${adv.status == 'CANCELLED'}">Hủy</span>
                                </td>
                                <td class="px-4 text-center">
                                    <form th:action="@{/admin/advisories/{id}/status(id=${adv.id})}" method="post" class="d-inline">
                                        <select name="status" class="form-select form-select-sm d-inline-block w-auto" onchange="this.form.submit()">
                                            <option value="PENDING" th:selected="${adv.status == 'PENDING'}">Chưa gọi</option>
                                            <option value="CONTACTED" th:selected="${adv.status == 'CONTACTED'}">Đã liên hệ</option>
                                            <option value="CANCELLED" th:selected="${adv.status == 'CANCELLED'}">Hủy</option>
                                        </select>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
