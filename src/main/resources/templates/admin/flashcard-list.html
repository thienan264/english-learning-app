<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Từ vựng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <a href="/admin/courses" class="btn btn-secondary mb-3">&larr; Quay lại</a>
        <h3 class="mb-4">Bộ từ vựng khóa học: <span class="text-success" th:text="${course.title}"></span></h3>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow border-success">
                    <div class="card-header bg-success text-white">Thêm Từ Mới</div>
                    <div class="card-body">
                        <form th:action="@{'/admin/courses/' + ${course.id} + '/flashcards/add'}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Từ tiếng Anh (Word)</label>
                                <input type="text" name="word" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phiên âm (Phonetic)</label>
                                <input type="text" name="phonetic" class="form-control" placeholder="VD: /həˈləʊ/">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nghĩa tiếng Việt (Meaning)</label>
                                <input type="text" name="meaning" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Câu ví dụ (Example)</label>
                                <textarea name="exampleSentence" class="form-control" rows="2"></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Thêm vào bộ thẻ</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">Danh sách Từ vựng</div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Từ vựng</th>
                                    <th>Phiên âm</th>
                                    <th>Nghĩa</th>
                                    <th>Ví dụ</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="fc : ${flashcards}">
                                    <td class="fw-bold text-primary" th:text="${fc.word}"></td>
                                    <td th:text="${fc.phonetic}"></td>
                                    <td th:text="${fc.meaning}"></td>
                                    <td class="fst-italic text-muted" th:text="${fc.exampleSentence}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
