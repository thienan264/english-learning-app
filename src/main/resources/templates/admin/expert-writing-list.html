<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chấm bài Writing · Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/readability.css}" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/admin.js}"></script><th:block th:replace="~{layout/page-transition :: transition}"></th:block>
<link rel="stylesheet" th:href="@{/css/expert-writing.css}"></head><body class="admin-page bg-light"><div th:replace="~{layout/admin-navbar :: admin-navbar}"></div><main class="container py-4 admin-main"><header class="admin-page-heading"><div class="admin-page-heading-icon"><i class="bi bi-chat-square-text"></i></div><div><h1>Chấm bài Writing</h1><p>Bài học viên gửi chuyên gia · tối đa 2 lần cho mỗi bài Writing.</p></div></header>
<form method="get" th:action="@{/admin/writing/reviews}" class="card p-3 mb-4"><label for="reviewStatus" class="form-label">Trạng thái</label><div class="d-flex gap-3"><select id="reviewStatus" name="status" class="form-select"><option value="WAITING_REVIEW" th:selected="${selectedStatus == 'WAITING_REVIEW'}">Chờ phản hồi</option><option value="REVIEWED" th:selected="${selectedStatus == 'REVIEWED'}">Đã phản hồi</option><option value="ALL" th:selected="${selectedStatus == 'ALL'}">Tất cả</option></select><button class="btn btn-primary">Lọc</button></div></form>
<div class="table-responsive card p-3"><table class="table align-middle"><thead><tr><th>Học viên</th><th>Khóa học / Bài Writing</th><th>Lần gửi</th><th>Ngày nộp</th><th>Trạng thái</th><th>Band</th><th>Thao tác</th></tr></thead><tbody><tr th:each="s : ${submissions}"><td><strong th:text="${s.user.fullName}"></strong><small class="d-block text-muted" th:text="${s.user.username}"></small></td><td><span th:text="${s.lesson.module != null ? s.lesson.module.course.title : s.lesson.course.title}"></span><small class="d-block text-muted" th:text="${s.lesson.title}"></small></td><td th:text="${s.expertAttempt} + '/2'"></td><td th:text="${#temporals.format(s.submittedAt,'dd/MM/yyyy HH:mm')}"></td><td><span class="badge" th:classappend="${s.status == 'REVIEWED' ? 'bg-success' : 'bg-warning text-dark'}" th:text="${s.status == 'REVIEWED' ? 'Đã phản hồi' : 'Chờ phản hồi'}"></span></td><td th:text="${s.bandScore != null ? #numbers.formatDecimal(s.bandScore,1,1) : '—'}"></td><td><a class="btn btn-primary" th:href="@{/admin/writing/reviews/{id}(id=${s.id})}" th:text="${s.status == 'REVIEWED' ? 'Xem phản hồi' : 'Chấm bài'}"></a></td></tr><tr th:if="${#lists.isEmpty(submissions)}"><td colspan="7" class="text-center text-muted py-4">Chưa có bài viết ở trạng thái này.</td></tr></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
