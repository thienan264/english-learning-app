<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Quản lý Thông báo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link rel="stylesheet" th:href="@{/css/readability.css}">
<link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/admin.js}"></script><th:block th:replace="~{layout/page-transition :: transition}"></th:block>
<script defer th:src="@{/js/admin-notification-filters.js}"></script>
</head>
<body class="admin-page bg-light">

<div th:replace="~{layout/admin-navbar :: admin-navbar}"></div>

<div class="container py-4 admin-main"><header class="admin-page-heading"><div class="admin-page-heading-icon" aria-hidden="true"><i class="bi bi-bell"></i></div><div><h1>Trung tâm thông báo</h1><p>Cập nhật các hoạt động cần chú ý trong hệ thống.</p></div></header>
    <div class="d-flex justify-content-between align-items-center mb-4">

        <form th:action="@{/admin/notifications/read-all}" method="post">
            <button type="submit" class="btn btn-outline-primary">Đánh dấu tất cả đã đọc</button>
        </form>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <section class="card border-0 shadow-sm p-4 mb-4" aria-label="Bộ lọc thông báo">
        <div class="row g-3 align-items-end">
            <div class="col-lg-5"><label class="form-label fw-bold" for="notificationSearch">Tìm tên / nội dung</label><input type="search" id="notificationSearch" class="form-control" placeholder="Tên học viên, khóa học hoặc nội dung thông báo…"></div>
            <div class="col-lg-3"><label class="form-label fw-bold" for="notificationType">Loại thông báo</label><select id="notificationType" class="form-select"><option value="">Tất cả loại thông báo</option></select></div>
            <div class="col-lg-3"><label class="form-label fw-bold" for="notificationRead">Trạng thái</label><select id="notificationRead" class="form-select"><option value="">Tất cả trạng thái</option><option value="false">Chưa đọc</option><option value="true">Đã đọc</option></select></div>
            <div class="col-lg-1"><button type="button" id="notificationReset" class="btn btn-outline-secondary w-100">Xóa lọc</button></div>
        </div>
        <p id="notificationFilterCount" class="small text-muted mt-3 mb-0" role="status" aria-live="polite"></p>
    </section>
    <div id="notificationFilterEmpty" class="alert alert-light border text-center py-4" hidden>Không có thông báo phù hợp với bộ lọc.</div>
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
            <div class="list-group list-group-flush">
                <div th:if="${#lists.isEmpty(notifications)}" class="p-4 text-center text-muted">
                    Không có thông báo nào.
                </div>
                <div th:each="notif : ${notifications}" 
                     class="list-group-item list-group-item-action p-3 admin-notification-item"
                     th:data-title="${notif.title}" th:data-read="${notif.isRead}"
                     th:classappend="${!notif.isRead ? 'list-group-item-light fw-bold' : ''}">
                    <div class="d-flex w-100 justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1">
                                <i th:if="${!notif.isRead}" class="bi bi-circle-fill text-primary me-2" style="font-size: .875rem;"></i>
                                <span th:text="${notif.title}"></span>
                            </h6>
                            <p class="mb-1 text-muted small" th:text="${notif.message}"></p>
                            <small class="text-secondary" th:text="${#temporals.format(notif.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                        </div>
                        <div>
                            <form th:if="${!notif.isRead}" th:action="@{/admin/notifications/{id}/read(id=${notif.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-primary">Xem</button>
                            </form>
                            <a th:if="${notif.isRead and notif.link != null}" th:href="${notif.link}" class="btn btn-sm btn-outline-secondary">Xem lại</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
