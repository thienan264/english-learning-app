<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Quản lý Học viên Đăng ký - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/enrollment-groups.css}">
    <script defer th:src="@{/js/enrollment-groups.js}"></script>
<link rel="stylesheet" th:href="@{/css/readability.css}">
<link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/admin.js}"></script><th:block th:replace="~{layout/page-transition :: transition}"></th:block>
</head>
<body class="admin-page bg-light">

<div th:replace="~{layout/admin-navbar :: admin-navbar}"></div>

<div class="container py-4 admin-main"><header class="admin-page-heading"><div class="admin-page-heading-icon" aria-hidden="true"><i class="bi bi-person-check"></i></div><div><h1>Học viên đăng ký</h1><p>Quản lý quyền học và thời hạn truy cập khóa học.</p></div></header>
    <div class="d-flex justify-content-between align-items-center mb-4">

    </div>

    <!-- Alert Messages -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <section class="enrollment-filters card border-0 p-4 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-lg-5"><label for="enrollmentSearch" class="form-label fw-bold">Tìm học viên</label><input id="enrollmentSearch" class="form-control" type="search" placeholder="Họ tên, tên đăng nhập hoặc email…"></div>
            <div class="col-lg-3"><label for="enrollmentCourse" class="form-label fw-bold">Khóa học</label><select id="enrollmentCourse" class="form-select"><option value="">Tất cả khóa học</option></select></div>
            <div class="col-lg-3"><label for="enrollmentStatus" class="form-label fw-bold">Trạng thái</label><select id="enrollmentStatus" class="form-select"><option value="">Tất cả trạng thái</option><option value="learning">Đang học</option><option value="COMPLETED">Đã hoàn thành</option><option value="REVOKED">Bị thu hồi</option><option value="expired">Hết hạn</option></select></div>
            <div class="col-lg-1"><button id="enrollmentReset" type="button" class="btn btn-outline-secondary w-100">Xóa lọc</button></div>
        </div>
        <p id="enrollmentCount" class="small text-muted mt-3 mb-0" role="status" aria-live="polite"></p>
    </section>
    <div id="enrollmentGroups">
        <details class="enrollment-group" th:each="group : ${enrollmentGroups}" th:data-student="${group[0].user.fullName + ' ' + group[0].user.username + ' ' + group[0].user.email}">
            <summary><span class="enrollment-person-icon" aria-hidden="true"><i class="bi bi-person"></i></span><span class="enrollment-person"><strong th:text="${#strings.isEmpty(group[0].user.fullName) ? group[0].user.username : group[0].user.fullName}"></strong><small><span th:text="${group[0].user.username}"></span> · <span th:text="${group[0].user.email}"></span></small></span><span class="enrollment-group-count" th:text="${#lists.size(group)} + ' khóa học'"></span><i class="bi bi-chevron-down enrollment-chevron" aria-hidden="true"></i></summary>
            <div class="table-responsive px-3 pb-3">
                <table class="table align-middle" data-enrollment-group-table>
                    <thead><tr><th>ID</th><th>Khóa học</th><th>Tiến độ</th><th>Trạng thái</th><th>Ngày đăng ký</th><th>Ngày hết hạn</th><th class="text-end">Thao tác</th></tr></thead>
                    <tbody>
                        <tr th:each="enrollment : ${group}" class="enrollment-row" th:data-course-id="${enrollment.course.id}" th:data-course-title="${enrollment.course.title}" th:data-status="${enrollment.status}" th:data-expired="${enrollment.expiresAt != null and !enrollment.expiresAt.isAfter(enrollmentNow)}">
                            <td th:text="${enrollment.id}"></td>
                            <td th:text="${enrollment.course.title}"></td>
                            <td>
                                <div class="progress" style="height: 8px; width: 100px;">
                                  <div class="progress-bar bg-success" role="progressbar" th:style="'width: ' + ${enrollment.completionPercentage} + '%'" th:aria-valuenow="${enrollment.completionPercentage}" aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                                <small class="text-muted" th:text="${enrollment.completionPercentage} + '%'"></small>
                            </td>
                            <td>
                                <span th:if="${enrollment.status == 'COMPLETED'}" class="badge bg-success">Đã hoàn thành</span>
                                <span th:if="${enrollment.status == 'IN_PROGRESS' or enrollment.status == 'ACTIVE'}" class="badge bg-primary">Đang học</span>
                                <span th:if="${enrollment.status == 'REVOKED'}" class="badge bg-danger">Bị thu hồi</span>
                            </td>
                            <td th:text="${#temporals.format(enrollment.enrolledAt, 'dd/MM/yyyy')}"></td>
                            <td>
                                <span th:if="${enrollment.expiresAt == null}" class="badge bg-success text-white">Vĩnh viễn</span>
                                <th:block th:if="${enrollment.expiresAt != null}">
                                    <span th:if="${enrollment.expiresAt.isAfter(enrollmentNow)}" class="text-success fw-bold" th:text="${#temporals.format(enrollment.expiresAt, 'dd/MM/yyyy')}"></span>
                                    <span th:if="${enrollment.expiresAt.isBefore(enrollmentNow)}" class="text-danger fw-bold"><i class="bi bi-x-circle me-1"></i>Hết hạn (<span th:text="${#temporals.format(enrollment.expiresAt, 'dd/MM/yyyy')}"></span>)</span>
                                </th:block>
                            </td>
                            <td class="text-end">
                                <div class="d-flex justify-content-end gap-2">
                                    <button class="btn btn-sm btn-outline-primary" title="Gia hạn" data-bs-toggle="modal" th:data-bs-target="'#extendModal' + ${enrollment.id}">
                                        <i class="bi bi-clock-history"></i>
                                    </button>
                                    <form th:if="${enrollment.status != 'REVOKED'}" th:action="@{/admin/enrollments/{id}/revoke(id=${enrollment.id})}" method="post" onsubmit="return confirm('Thu hồi quyền học của học viên này?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Thu hồi">
                                            <i class="bi bi-slash-circle"></i>
                                        </button>
                                    </form>
                                </div>

                                <!-- Extend Modal -->
                                <div class="modal fade" th:id="'extendModal' + ${enrollment.id}" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
                                  <div class="modal-dialog">
                                    <div class="modal-content text-start">
                                      <form th:action="@{/admin/enrollments/{id}/extend(id=${enrollment.id})}" method="post">
                                          <div class="modal-header">
                                            <h5 class="modal-title">Gia hạn khóa học</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                          </div>
                                          <div class="modal-body">
                                            <p>Gia hạn khóa <strong><span th:text="${enrollment.course.title}"></span></strong> cho học viên <strong><span th:text="${enrollment.user.username}"></span></strong></p>
                                            <div class="mb-3">
                                                <label class="form-label">Số tháng gia hạn</label>
                                                <input type="number" name="months" class="form-control" value="1" min="1" required>
                                            </div>
                                          </div>
                                          <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                                            <button type="submit" class="btn btn-primary">Xác nhận</button>
                                          </div>
                                      </form>
                                    </div>
                                  </div>
                                </div>

                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </details>
    </div>
    <div id="enrollmentEmpty" class="alert alert-light border text-center py-4" hidden>Không có học viên phù hợp với bộ lọc.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
