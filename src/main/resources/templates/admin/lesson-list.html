<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Bài học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{layout/admin-navbar :: admin-navbar}"></div>
    <div class="container mt-4">
        <a href="/admin/courses" class="btn btn-secondary mb-3">&larr; Quay lại danh sách Khóa học</a>

        <h3 class="mb-4">Khóa học: <span class="text-primary" th:text="${course.title}"></span></h3>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">Thêm Bài Học</div>
                    <div class="card-body">
                        <form th:action="@{'/admin/courses/' + ${course.id} + '/lessons/add'}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Tên bài học</label>
                                <input type="text" name="title" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Loại kỹ năng</label>
                                <select name="skillType" class="form-select">
                                    <option value="LISTENING">Listening (Nghe)</option>
                                    <option value="READING">Reading (Đọc)</option>
                                    <option value="WRITING">Writing (Viết)</option>
                                </select>
                            </div>
                            <div id="contentGroup" style="display: none;">
                                <div class="mb-3">
                                    <label class="form-label text-primary fw-bold">📊 Chọn đề bài Task 1</label>
                                    <select name="task1Id" class="form-select">
                                        <option value="">-- Không chọn (Chỉ thi Task 2) --</option>
                                        <option th:each="t : ${task1List}" th:value="${t.id}" th:text="${t.title}"></option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-success fw-bold">✍️ Chọn đề bài Task 2</label>
                                    <select name="task2Id" class="form-select">
                                        <option value="">-- Không chọn (Chỉ thi Task 1) --</option>
                                        <option th:each="t : ${task2List}" th:value="${t.id}" th:text="${t.title}"></option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">⏳ Thời gian làm bài (phút)</label>
                                    <input type="number" name="totalTimeMinutes" class="form-control" value="60">
                                </div>
                            </div>
                            
                            <script>
                                document.addEventListener("DOMContentLoaded", function() {
                                    const skillSelect = document.querySelector('select[name="skillType"]');
                                    const contentGroup = document.getElementById('contentGroup');
                                    
                                    function toggleFields() {
                                        if (skillSelect.value === 'WRITING') {
                                            contentGroup.style.display = 'block';
                                        } else {
                                            contentGroup.style.display = 'none';
                                        }
                                    }
                                    
                                    skillSelect.addEventListener('change', toggleFields);
                                    toggleFields(); // Initial check
                                });
                            </script>
                            <button type="submit" class="btn btn-success w-100">Thêm bài học</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">Danh sách Bài học</div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Tên bài</th>
                                    <th>Kỹ năng</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="lesson : ${lessons}">
                                    <td th:text="${lesson.id}"></td>
                                    <td th:text="${lesson.title}"></td>
                                    <td><span class="badge bg-info" th:text="${lesson.skillType}"></span></td>
                                    <td>
                                        <a th:if="${lesson.skillType == 'READING' || lesson.skillType == 'LISTENING'}" 
                                           th:href="@{'/admin/lessons/' + ${lesson.id} + '/exam-builder'}" 
                                           class="btn btn-sm btn-primary">Tạo đề thi (Mới)</a>
                                        <a th:if="${lesson.skillType == 'WRITING'}" 
                                           th:href="@{'/admin/lessons/' + ${lesson.id} + '/questions'}" 
                                           class="btn btn-sm btn-warning">Câu hỏi</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
