<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đánh giá khóa học · Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/readability.css}" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/admin.js}"></script><th:block th:replace="~{layout/page-transition :: transition}"></th:block>
</head><body class="admin-page bg-light"><div th:replace="~{layout/admin-navbar :: admin-navbar}"></div><main class="container py-4 admin-main"><header class="admin-page-heading"><div class="admin-page-heading-icon" aria-hidden="true"><i class="bi bi-star"></i></div><div><h1>Đánh giá khóa học</h1><p>Theo dõi phản hồi và quản lý đánh giá của học viên.</p></div></header><div class="d-flex justify-content-between mb-3"><a th:href="@{/admin/courses}" class="btn btn-outline-primary">Quản lý khóa học</a></div><form class="card p-3 mb-4" method="get" th:action="@{/admin/reviews}"><div class="row g-3 align-items-end"><div class="col-md-8"><label for="reviewCourse" class="form-label">Lọc theo khóa học</label><select id="reviewCourse" name="courseId" class="form-select"><option value="">Tất cả khóa học</option><option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.title}" th:selected="${selectedCourseId != null and selectedCourseId == c.id}"></option></select></div><div class="col-md-4 d-flex gap-2"><button class="btn btn-primary" type="submit">Áp dụng</button><a class="btn btn-outline-secondary" th:href="@{/admin/reviews}">Xem tất cả</a></div></div></form><p th:if="${selectedCourse != null}" class="fw-semibold">Đánh giá của: <span class="text-primary" th:text="${selectedCourse.title}"></span></p><p class="text-muted">Đánh giá bị ẩn không hiển thị với học viên và không tính vào điểm trung bình.</p><div class="table-responsive bg-white rounded shadow-sm"><table class="table align-middle"><thead><tr><th>Khóa học</th><th>Học viên</th><th>Sao</th><th>Nhận xét</th><th>Cập nhật</th><th>Hiển thị</th></tr></thead><tbody><tr th:each="r : ${reviews}"><td th:text="${r.course.title}"></td><td th:text="${r.user.username}"></td><td th:text="${r.rating} + '/5'"></td><td style="max-width:350px;white-space:pre-line;overflow-wrap:anywhere" th:text="${r.comment}"></td><td th:text="${#temporals.format(r.updatedAt,'dd/MM/yyyy HH:mm')}"></td><td><form th:action="@{/admin/reviews/{id}/visibility(id=${r.id})}" method="post"><input th:if="${selectedCourseId != null}" type="hidden" name="courseId" th:value="${selectedCourseId}"><input type="hidden" name="visible" th:value="${!r.visible}"><button type="submit" class="btn btn-sm" th:classappend="${r.visible ? 'btn-outline-warning' : 'btn-outline-success'}" th:text="${r.visible ? 'Ẩn đánh giá' : 'Hiện lại'}"></button></form></td></tr><tr th:if="${#lists.isEmpty(reviews)}"><td colspan="6" class="text-center py-4 text-muted">Chưa có đánh giá.</td></tr></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
