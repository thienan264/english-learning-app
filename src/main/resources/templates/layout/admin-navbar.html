<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"></head>
<body>
<nav th:fragment="admin-navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm" style="padding: 12px 0;">
    <!-- Page Transition Effect for Admin -->
    <div th:replace="~{layout/page-transition :: transition}"></div>
    
    <style>
        .admin-nav-hover {
            transition: all 0.3s ease;
            position: relative;
        }
        .admin-nav-hover::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            bottom: -3px;
            left: 50%;
            background-color: #0d6efd;
            transition: all 0.3s ease;
            transform: translateX(-50%);
            border-radius: 2px;
        }
        .admin-nav-hover:hover::after, .admin-nav-hover.active::after {
            width: 80%;
        }
        .admin-nav-hover:hover, .admin-nav-hover.active {
            color: #0d6efd !important;
        }
        
        /* Dropdown Animation */
        .nav-item.dropdown:hover .dropdown-menu {
            display: block;
            animation: slideUp 0.3s ease forwards;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .dropdown-menu {
            display: none; /* Hide by default, Bootstrap handles via JS, but we handle via hover */
            margin-top: 0 !important;
        }
        .dropdown-item {
            transition: all 0.2s ease;
        }
        .dropdown-item:hover {
            background-color: #f0f8ff;
            transform: translateX(5px);
            color: #0d6efd !important;
            font-weight: 600;
        }
        .dropdown-item.active-dropdown {
            background-color: #f0f8ff;
            color: #0d6efd !important;
            font-weight: 600;
            border-left: 3px solid #0d6efd;
        }
    </style>
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold fs-5 me-5" th:href="@{/admin/dashboard}">
            <i class="bi bi-robot text-primary me-2"></i>EngMaster <span class="text-primary">Admin</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto fw-semibold" style="gap: 10px;">
                <li class="nav-item">
                    <a class="nav-link admin-nav-hover text-white px-3 rounded" href="/admin/dashboard" id="nav-dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link admin-nav-hover text-white px-3 rounded" href="/admin/courses" id="nav-courses"><i class="bi bi-journal-album me-1"></i>Khóa học</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link admin-nav-hover text-white px-3 rounded" href="/admin/exams" id="nav-exams"><i class="bi bi-box-seam me-1"></i>Ngân hàng Đề thi</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link admin-nav-hover text-white px-3 rounded" href="/admin/orders" id="nav-orders"><i class="bi bi-cart-check me-1"></i>Đơn hàng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link admin-nav-hover text-white px-3 rounded" href="/admin/users" id="nav-users"><i class="bi bi-people me-1"></i>Tài khoản</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle admin-nav-hover text-white px-3 rounded" href="#" role="button" data-bs-toggle="dropdown" id="nav-writing"><i class="bi bi-pencil-square me-1"></i>Writing</a>
                    <ul class="dropdown-menu shadow border-0 mt-2">
                        <li><a class="dropdown-item py-2" href="/admin/writing/tasks" id="nav-writing-tasks"><i class="bi bi-card-text text-primary me-2"></i>Ngân hàng đề bài</a></li>
                        <li><a class="dropdown-item py-2" href="/admin/writing/exams" id="nav-writing-exams"><i class="bi bi-layout-text-window text-success me-2"></i>Ghép đề thi</a></li>
                    </ul>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <!-- Notifications Dropdown -->
                <div class="dropdown me-3">
                    <button class="btn btn-dark border-0 position-relative" type="button" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="background: transparent;">
                        <i class="bi bi-bell fs-5 text-white"></i>
                        <span th:if="${adminUnreadCount != null and adminUnreadCount > 0}" 
                              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                              style="font-size: 0.6rem; margin-top: 8px; margin-left: -10px;">
                            <span th:text="${adminUnreadCount > 9 ? '9+' : adminUnreadCount}"></span>
                        </span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 p-0" aria-labelledby="notifDropdown" style="width: 320px; max-height: 400px; overflow-y: auto;">
                        <div class="d-flex justify-content-between align-items-center bg-light p-2 border-bottom">
                            <span class="fw-bold text-dark">Thông báo</span>
                            <form th:action="@{/admin/notifications/read-all}" method="post" class="m-0">
                                <button type="submit" class="btn btn-link btn-sm text-decoration-none p-0">Đọc tất cả</button>
                            </form>
                        </div>
                        <div th:if="${adminUnreadNotifs == null or #lists.isEmpty(adminUnreadNotifs)}" class="p-3 text-center text-muted small">
                            Không có thông báo mới.
                        </div>
                        <div class="list-group list-group-flush" th:if="${adminUnreadNotifs != null}">
                            <div th:each="notif, iterStat : ${adminUnreadNotifs}" th:if="${iterStat.index < 5}">
                                <form th:action="@{/admin/notifications/{id}/read(id=${notif.id})}" method="post" class="m-0">
                                    <button type="submit" class="list-group-item list-group-item-action p-2 border-bottom text-start bg-transparent border-0 w-100">
                                        <div class="d-flex w-100 justify-content-between">
                                            <strong class="mb-1 text-primary small" th:text="${notif.title}"></strong>
                                            <small class="text-muted" style="font-size: 0.7rem;" th:text="${#temporals.format(notif.createdAt, 'dd/MM HH:mm')}"></small>
                                        </div>
                                        <p class="mb-1 text-dark small text-truncate" th:text="${notif.message}" style="max-width: 280px;"></p>
                                    </button>
                                </form>
                            </div>
                        </div>
                        <div class="p-2 text-center border-top bg-light">
                            <a href="/admin/notifications" class="text-decoration-none small fw-bold">Xem tất cả thông báo</a>
                        </div>
                    </div>
                </div>

                <div class="dropdown">
                    <button class="btn btn-primary rounded-pill px-4 fw-bold dropdown-toggle" type="button" id="adminMenu" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1"></i> <span sec:authentication="name">Admin</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="adminMenu">
                        <li><a class="dropdown-item py-2 fw-semibold" th:href="@{/}"><i class="bi bi-house-door text-info me-2"></i>Về trang chủ</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item py-2 fw-semibold text-danger"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const path = window.location.pathname;
            if (path.startsWith('/admin/dashboard')) document.getElementById('nav-dashboard').classList.add('active');
            else if (path.startsWith('/admin/courses')) document.getElementById('nav-courses').classList.add('active');
            else if (path.startsWith('/admin/exams')) document.getElementById('nav-exams').classList.add('active');
            else if (path.startsWith('/admin/orders')) document.getElementById('nav-orders').classList.add('active');
            else if (path.startsWith('/admin/users')) document.getElementById('nav-users').classList.add('active');
            else if (path.startsWith('/admin/writing')) {
                document.getElementById('nav-writing').classList.add('active');
                if (path.startsWith('/admin/writing/tasks')) document.getElementById('nav-writing-tasks').classList.add('active-dropdown');
                else if (path.startsWith('/admin/writing/exams')) document.getElementById('nav-writing-exams').classList.add('active-dropdown');
            }
        });
    </script>
</nav>
</body>
</html>
