<div xmlns:th="http://www.thymeleaf.org" th:fragment="card(course)" class="card shadow-sm h-100 border-0 course-card bg-white overflow-hidden">
<a th:href="@{/courses/{id}(id=${course.id})}" th:if="${!#strings.isEmpty(course.thumbnailUrl)}" class="position-relative d-block bg-light"><img th:src="${course.thumbnailUrl}" th:alt="${course.title}" class="w-100" style="height:165px;object-fit:contain"><span th:if="${course.isNewCourse}" class="badge bg-danger position-absolute top-0 end-0 m-2">Mới</span></a>
<div class="card-body p-3">
<div th:if="${course.isFree == false}" class="rounded-3 px-3 py-2 mb-3 fw-bold" th:classappend="${course.isExpired ? 'bg-danger-subtle text-danger' : 'bg-primary-subtle text-primary'}"><i class="bi bi-clock-history me-1"></i><th:block th:if="${course.isExpired}">Đã hết hạn</th:block><th:block th:if="${!course.isExpired and course.isEnrolled and course.expiresAt != null}">Còn <span th:text="${course.daysUntilExpiration}"></span> ngày</th:block><th:block th:if="${!course.isExpired and (!course.isEnrolled or course.expiresAt == null)}"><span th:text="${!course.isEnrolled and course.accessDurationMonths != null and course.accessDurationMonths > 0 ? 'Thời hạn: ' + course.accessDurationMonths + ' tháng' : 'Không giới hạn thời gian'}"></span></th:block></div>
<div class="d-flex flex-wrap gap-2 mb-2"><span class="badge bg-light text-secondary" th:text="${course.level}"></span><span th:if="${course.isEnrolled and !course.isExpired}" class="badge bg-primary-subtle text-primary">Đã mở khóa</span><span th:if="${course.isFree != false}" class="badge bg-success-subtle text-success">Miễn phí</span></div>
<h3 class="h5 fw-bold mb-2"><a class="text-dark text-decoration-none" th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.title}"></a></h3>
<div th:if="${course.isFree == false}" class="small mb-2"><span class="text-warning" th:aria-label="${course.averageRating} + ' trên 5 sao'"><i th:each="star : ${#numbers.sequence(1,5)}" class="bi" th:classappend="${course.averageRating >= star ? 'bi-star-fill' : (course.averageRating >= star - 0.5 ? 'bi-star-half' : 'bi-star')}"></i></span> <span th:text="${#numbers.formatDecimal(course.averageRating,1,1)} + '/5'"></span> <span class="text-muted" th:text="'(' + ${course.reviewCount} + ') · ' + ${course.purchaseCount} + ' lượt mua'"></span></div>
<th:block th:replace="~{layout/sale-countdown :: countdown(${course}, ${course.promotionAvailable})}"></th:block>
<div th:if="${course.isFree == false and (!course.isEnrolled or course.isExpired)}" class="fw-bold text-danger fs-5"><del th:if="${course.promotionAvailable}" class="small text-muted me-2" th:text="${#numbers.formatDecimal(course.price,1,'COMMA',0,'POINT')} + ' ₫'"></del><span th:text="${#numbers.formatDecimal(course.promotionAvailable ? course.salePrice : course.price,1,'COMMA',0,'POINT')} + ' ₫'"></span></div>
<div th:if="${course.isEnrolled and !course.isExpired}" class="mt-2"><div class="d-flex justify-content-between small text-muted"><span>Tiến độ học</span><span th:text="${#numbers.formatDecimal(course.completionPercentage,1,0)} + '%'"></span></div><div class="progress mt-1" style="height:5px"><div class="progress-bar" th:style="'width:' + ${course.completionPercentage} + '%'" role="progressbar" th:aria-valuenow="${course.completionPercentage}" aria-valuemin="0" aria-valuemax="100"></div></div></div>
<div th:if="${course.isFree != false}" class="free-course-highlight mt-3" th:with="placement=${#strings.containsIgnoreCase(course.title, 'đầu vào')}">
    <span class="free-course-highlight-icon" aria-hidden="true"><i class="bi" th:classappend="${placement ? 'bi-compass' : 'bi-book'}"></i></span>
    <div>
        <h4 th:text="${placement ? 'Tìm bước khởi đầu phù hợp' : 'Bắt đầu học, không cần thanh toán'}"></h4>
        <p th:text="${placement ? 'Làm bài đánh giá để nhận gợi ý mức học Reading và Listening phù hợp với kết quả của bạn.' : (!#strings.isEmpty(course.description) ? course.description : 'Khám phá bài học và luyện tập theo lộ trình của khóa.')}"></p>
        <span class="free-course-highlight-note"><i class="bi bi-check-circle me-1" aria-hidden="true"></i>Nội dung miễn phí</span>
    </div>
</div>
</div><div class="card-footer bg-transparent border-0 p-3 pt-0"><a th:href="@{/courses/{id}(id=${course.id})}" class="btn w-100 fw-bold" th:classappend="${course.isEnrolled and !course.isExpired ? 'btn-primary' : (course.isFree == false ? 'course-purchase-cta' : 'btn-outline-primary')}" ><i th:if="${course.isFree == false and (!course.isEnrolled or course.isExpired)}" class="bi bi-cart-check-fill me-2" aria-hidden="true"></i><span th:text="${course.isEnrolled and !course.isExpired ? 'Tiếp tục học' : (course.isFree == false ? 'Tham khảo khóa học' : 'Khám phá khóa học')}"></span><i th:if="${course.isFree == false and (!course.isEnrolled or course.isExpired)}" class="bi bi-arrow-right ms-2" aria-hidden="true"></i></a></div>
</div>
