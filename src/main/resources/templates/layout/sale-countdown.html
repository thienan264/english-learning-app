<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="countdown(course, active)">
    <div th:if="${active}" class="offer-countdown" th:classappend="${course.saleEndDate == null ? 'offer-countdown-unlimited' : ''}">
        <i class="bi bi-stopwatch" aria-hidden="true"></i>
        <div th:if="${course.saleEndDate != null}" class="offer-countdown-clock" th:data-offer-end="${#temporals.format(course.saleEndDate, 'yyyy-MM-dd''T''HH:mm:ss') + '+07:00'}">
            <span class="offer-countdown-label">Ưu đãi kết thúc sau</span>
            <strong class="offer-countdown-value" th:text="${'Đến ' + #temporals.format(course.saleEndDate,'dd/MM/yyyy HH:mm')}"></strong>
        </div>
        <span th:if="${course.saleEndDate == null}" class="offer-countdown-label">Ưu đãi chưa có ngày kết thúc</span>
    </div>
</th:block>
