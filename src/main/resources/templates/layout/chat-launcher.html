<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="launcher">
<link rel="stylesheet" th:href="@{/css/chat-launcher.css}">
<a th:href="@{/chat}" class="chat-launcher" aria-label="Mở trợ lý học tập tự động">
    <span class="chat-launcher-avatar" aria-hidden="true">
        <svg class="chat-launcher-robot" viewBox="0 0 48 48" fill="none">
            <path d="M24 12V7" stroke="#bceaff" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="24" cy="6" r="3" fill="#7ef4cf"/>
            <rect x="8" y="13" width="32" height="27" rx="11" fill="#f1f8ff"/>
            <rect x="12" y="19" width="24" height="13" rx="6" fill="#153875"/>
            <g class="chat-launcher-eyes" fill="#80f5d3"><circle cx="19" cy="25" r="2.5"/><circle cx="29" cy="25" r="2.5"/></g>
            <path d="M20 35h8" stroke="#3676de" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M5 23v7M43 23v7" stroke="#bceaff" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span class="chat-launcher-spark">✦</span>
    </span>
    <span class="chat-launcher-copy"><span class="chat-launcher-title">Trợ lý học tập</span><span class="chat-launcher-subtitle">Cùng bạn chọn bước tiếp theo</span></span>
    <span class="chat-launcher-arrow" aria-hidden="true">↗</span>
</a>
</th:block>
</body></html>
