<div th:fragment="transition">
    <style>
        /* Page Transition Curtain */
        .page-transition-curtain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0d6efd 0%, #0098f0 100%);
            z-index: 999999;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page-transition-curtain.active {
            transform: translateY(0);
            pointer-events: all;
        }
        .page-transition-curtain.initial {
            transform: translateY(0);
            transition: none;
            pointer-events: all;
        }
        .page-transition-curtain.reveal {
            transform: translateY(-100%);
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
            pointer-events: none;
        }
        .page-transition-logo {
            color: white;
            font-family: 'Segoe UI', sans-serif;
            font-size: 3rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .page-transition-curtain.active .page-transition-logo, 
        .page-transition-curtain.initial .page-transition-logo {
            opacity: 1;
            transition-delay: 0.3s;
        }
        .page-transition-curtain.reveal .page-transition-logo {
            opacity: 0;
            transition-delay: 0s;
            transition-duration: 0.2s;
        }
        .spinner-border-custom {
            width: 3rem;
            height: 3rem;
            border-width: 0.25em;
            color: white;
            margin-top: 1rem;
        }
    </style>

    <div class="page-transition-curtain initial" id="pageTransitionCurtain">
        <div class="page-transition-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-robot mb-3 text-warning" viewBox="0 0 16 16">
              <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5ZM3 8.062C3 6.76 4.235 5.765 5.53 5.889a28.02 28.02 0 0 1 4.94 0C11.765 5.765 13 6.76 13 8.062v1.157a.933.933 0 0 1-.765.935c-.845.147-2.34.346-4.235.346-1.895 0-3.39-.2-4.235-.346A.933.933 0 0 1 3 9.219V8.062Zm4.542-.827a.25.25 0 0 0-.217.158l-.92 2.143a.25.25 0 1 0 .456.196l.106-.248h1.066l.106.248a.25.25 0 1 0 .456-.196l-.92-2.143a.25.25 0 0 0-.217-.158H7.542Z"/>
              <path d="M5.255 1.4a.25.25 0 0 0-.334-.05l-2.5 1.5a.25.25 0 0 0-.1.216l.5 6a.25.25 0 0 0 .164.21l1.5.5a.25.25 0 0 0 .315-.14l.5-1.5a.25.25 0 0 0-.104-.286l-1.026-.684-.33-3.955 1.84-1.104a.25.25 0 0 0 .075-.333l-1.5-2.5ZM10.745 1.4a.25.25 0 0 1 .334-.05l2.5 1.5a.25.25 0 0 1 .1.216l-.5 6a.25.25 0 0 1-.164.21l-1.5.5a.25.25 0 0 1-.315-.14l-.5-1.5a.25.25 0 0 1 .104-.286l1.026-.684.33-3.955-1.84-1.104a.25.25 0 0 1-.075-.333l1.5-2.5Z"/>
            </svg>
            <span>EngMaster AI</span>
            <div class="spinner-border spinner-border-custom" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const curtain = document.getElementById("pageTransitionCurtain");
            if (!curtain) return;

            const hideCurtain = () => {
                if (!curtain.classList.contains("initial") && !curtain.classList.contains("active")) return;
                curtain.classList.remove("initial");
                curtain.classList.add("reveal");
                
                setTimeout(() => {
                    curtain.classList.remove("reveal");
                    curtain.style.transform = "translateY(100%)"; 
                }, 600);
            };

            // Try to hide as soon as possible if DOM is ready
            if (document.readyState === "interactive" || document.readyState === "complete") {
                setTimeout(hideCurtain, 300);
            } else {
                document.addEventListener("DOMContentLoaded", () => setTimeout(hideCurtain, 300));
            }
            
            // Safety fallback: always hide after 1.5 seconds regardless of DOM events
            setTimeout(hideCurtain, 1500);

            // Wait for DOM to attach link listeners
            document.addEventListener("DOMContentLoaded", () => {
                const triggerTransition = (href) => {
                    curtain.style.transition = "transform 0.5s cubic-bezier(0.77, 0, 0.175, 1)";
                    curtain.style.transform = ""; 
                    curtain.classList.remove("reveal");
                    curtain.classList.add("active");
                    
                    setTimeout(() => {
                        window.location.href = href;
                    }, 500); // match transition duration
                };

                // Intercept clicks
                document.querySelectorAll('a').forEach(anchor => {
                    anchor.addEventListener('click', function(e) {
                        const href = this.getAttribute('href');
                        const target = this.getAttribute('target');
                        
                        // Don't intercept hash links or target="_blank"
                        if (href && !href.startsWith('#') && !href.startsWith('javascript:') && target !== '_blank' && !this.hasAttribute('data-bs-toggle')) {
                            // Skip if it's the same page
                            const currentPath = window.location.pathname;
                            try {
                                const linkUrl = new URL(this.href, window.location.origin);
                                if(linkUrl.pathname === currentPath && linkUrl.search === window.location.search) {
                                   return; 
                                }
                            } catch(e) {}

                            e.preventDefault();
                            triggerTransition(href);
                        }
                    });
                });

                // Intercept forms
                document.querySelectorAll('form').forEach(form => {
                    form.addEventListener('submit', function(e) {
                        if (e.defaultPrevented) return;
                        curtain.style.transition = "transform 0.5s cubic-bezier(0.77, 0, 0.175, 1)";
                        curtain.style.transform = ""; 
                        curtain.classList.remove("reveal");
                        curtain.classList.add("active");
                    });
                });
            });
            
            // Handle browser back/forward buttons (BFCache issue)
            window.addEventListener('pageshow', function (event) {
                if (event.persisted) {
                    curtain.classList.remove("active");
                    curtain.classList.add("reveal");
                    setTimeout(() => {
                        curtain.classList.remove("reveal");
                        curtain.style.transform = "translateY(100%)"; 
                    }, 600);
                }
            });
        })();
    </script>
</div>
