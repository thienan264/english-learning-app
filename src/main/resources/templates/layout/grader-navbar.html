<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><nav th:fragment="navbar" class="navbar bg-white border-bottom sticky-top px-4 py-3"><a class="navbar-brand fw-bold text-primary" th:href="@{/grader/writing/reviews}">EngMaster · Chấm Writing</a><div class="d-flex align-items-center gap-3"><div class="dropdown"><button class="btn btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">Thông báo <span class="badge bg-danger" th:text="${#lists.size(graderNotifications)}"></span></button><div class="dropdown-menu dropdown-menu-end p-2 shadow grader-notifications"><p th:if="${#lists.isEmpty(graderNotifications)}" class="text-muted p-2 mb-0">Chưa có thông báo mới.</p><form th:each="n : ${graderNotifications}" method="post" th:action="@{/grader/notifications/{id}/read(id=${n.id})}"><button class="dropdown-item py-3 text-wrap border-bottom" type="submit"><strong class="d-block text-primary" th:text="${n.title}"></strong><span th:text="${n.message}"></span><small class="d-block text-muted" th:text="${#temporals.format(n.createdAt,'dd/MM/yyyy HH:mm')}"></small></button></form></div></div><span class="fw-bold" th:text="${graderName}"></span><form method="post" th:action="@{/logout}"><button class="btn btn-outline-secondary">Đăng xuất</button></form></div></nav></body></html>
