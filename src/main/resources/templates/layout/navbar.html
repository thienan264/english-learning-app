<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top" style="z-index: 1050; padding: 15px 0;">
    <!-- Page Transition Effect -->
    <div th:replace="~{layout/page-transition :: transition}"></div>
    
    <style>
        /* Hiển thị menu khi hover */
        .notif-dropdown:hover .dropdown-menu {
            display: block;
            margin-top: 0;
        }
        
        /* Hiệu ứng hover cho Navbar Links nổi bật hơn */
        .nav-hover {
            position: relative;
            transition: color 0.3s ease;
        }
        .nav-hover::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            bottom: -5px;
            left: 50%;
            background-color: #ffc107; /* Màu vàng nổi bật */
            transition: all 0.3s ease;
            transform: translateX(-50%);
            border-radius: 2px;
        }
        .nav-hover:hover::after {
            width: 80%;
        }
        .nav-hover:hover {
            color: #ffc107 !important; /* Chữ đổi màu vàng */
        }
    </style>
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 me-5" th:href="@{/}">
            <i class="bi bi-robot text-warning me-2"></i>EngMaster AI
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto fw-semibold" style="gap: 15px;">
                <li class="nav-item">
                    <a class="nav-link text-white rounded px-3 transition-all nav-hover" th:href="@{/}"><i class="bi bi-house-door me-1"></i>Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white rounded px-3 transition-all nav-hover" th:href="@{/#courses}"><i class="bi bi-journal-text me-1"></i>Lộ trình</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white rounded px-3 transition-all nav-hover" th:href="@{/#teachers}"><i class="bi bi-people me-1"></i>Đội ngũ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white rounded px-3 transition-all nav-hover" th:href="@{/#commitments}"><i class="bi bi-shield-check me-1"></i>Cam kết</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white rounded px-3 transition-all nav-hover" th:href="@{/#offers}"><i class="bi bi-gift me-1"></i>Ưu đãi</a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <!-- Đã đăng nhập -->
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">

                    <!-- Nút chuông thông báo -->
                    <div class="dropdown me-3 notif-dropdown" onmouseenter="fetchNotifications()">
                        <a th:href="@{/notifications}" class="btn btn-primary position-relative" id="notifMenu" style="border: none;">
                            🔔
                            <span id="notifBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none; font-size: 0.65em;">
                                0
                            </span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="notifMenu" id="notifList" style="width: 300px; max-height: 400px; overflow-y: auto;">
                            <li><span class="dropdown-item text-center text-muted">Đang tải...</span></li>
                        </ul>
                    </div>

                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle fw-bold" type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                            👤 <span sec:authentication="name">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userMenu">
                            <li>
                                <a class="dropdown-item py-2" th:href="@{/profile}">
                                    📋 Hồ sơ cá nhân
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item py-2" th:href="@{/profile}">
                                    📊 Lịch sử làm bài
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item py-2 text-danger">
                                        🚪 Đăng xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script sec:authorize="isAuthenticated()">
        function updateNotifBadge(count) {
            const badge = document.getElementById('notifBadge');
            if (count > 0) {
                badge.innerText = count;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        }

        function fetchNotifications() {
            fetch('/api/notifications')
                .then(res => res.json())
                .then(data => {
                    updateNotifBadge(data.unreadCount);
                    const list = document.getElementById('notifList');
                    list.innerHTML = '';
                    
                    if (!data.notifications || data.notifications.length === 0) {
                        list.innerHTML = '<li><span class="dropdown-item text-center text-muted py-3">Không có thông báo nào</span></li>';
                        return;
                    }
                    
                    data.notifications.forEach(n => {
                        const li = document.createElement('li');
                        li.style.cursor = 'pointer';
                        li.className = n.read ? '' : 'bg-light';
                        
                        const a = document.createElement('a');
                        a.className = 'dropdown-item border-bottom py-2';
                        // Keep text wrap inside dropdown
                        a.style.whiteSpace = 'normal';
                        
                        // Bold title if unread
                        const titleStyle = n.read ? '' : 'fw-bold';
                        
                        a.innerHTML = `<div class="${titleStyle} text-primary mb-1" style="font-size: 0.9em;">${n.title}</div>
                                       <div class="small text-muted">${n.message}</div>`;
                        
                        a.onclick = function(e) {
                            e.preventDefault();
                            if (!n.read) {
                                // Mark as read and navigate
                                const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content;
                                const csrfHeader = document.querySelector('meta[name="csrf-header"]')?.content;
                                const headers = {'Content-Type': 'application/json'};
                                if(csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

                                fetch('/api/notifications/' + n.id + '/read', {
                                    method: 'POST',
                                    headers: headers
                                }).then(() => {
                                    window.location.href = n.url;
                                });
                            } else {
                                window.location.href = n.url;
                            }
                        };
                        
                        li.appendChild(a);
                        list.appendChild(li);
                    });
                })
                .catch(err => console.error('Error fetching notifs:', err));
        }

        // Fetch on load to get badge count
        window.addEventListener('DOMContentLoaded', () => {
            fetch('/api/notifications')
                .then(res => res.json())
                .then(data => updateNotifBadge(data.unreadCount))
                .catch(e => console.error(e));
        });

        // Listen for new notifications from flashcard flip
        window.addEventListener('notification-received', () => {
            fetch('/api/notifications')
                .then(res => res.json())
                .then(data => updateNotifBadge(data.unreadCount))
                .catch(e => console.error(e));
        });
    </script>
</nav>

<!-- Bootstrap JS Bundle (bắt buộc cho dropdown hoạt động) -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
