<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<nav th:fragment="navbar" class="site-navbar student-navbar navbar navbar-expand-xl navbar-light sticky-top" style="z-index: 1050; padding: 15px 0;">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <!-- Page Transition Effect -->


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menu = document.querySelector('.account-dropdown');
            if (!menu) return;
            const toggle = menu.querySelector('[data-bs-toggle="dropdown"]');
            const hover = window.matchMedia('(hover: hover) and (pointer: fine)');
            menu.addEventListener('mouseenter', () => {
                if (hover.matches && window.bootstrap) {
                    bootstrap.Dropdown.getOrCreateInstance(toggle, {display: 'static'}).show();
                }
            });
            menu.addEventListener('mouseleave', () => {
                if (hover.matches && window.bootstrap) {
                    bootstrap.Dropdown.getOrCreateInstance(toggle).hide();
                }
            });
            menu.addEventListener('focusout', () => {
                setTimeout(() => {
                    if (!menu.contains(document.activeElement) && !menu.matches(':hover') && window.bootstrap) {
                        bootstrap.Dropdown.getOrCreateInstance(toggle).hide();
                    }
                }, 0);
            });
        });
    </script>
    <style>
        .account-dropdown .account-toggle {
            border-radius: 13px;
            border: 1px solid #d9e4f5;
            background: #f7faff;
            color: #223a60;
            padding: 9px 14px;
            box-shadow: 0 3px 10px #10356f0c;
        }
        .account-dropdown .account-toggle:focus { box-shadow: 0 0 0 3px #bcd2fa55; }
        .account-dropdown > .dropdown-menu {
            width: 300px;
            max-width: calc(100vw - 2rem);
            padding: 8px;
            border-radius: 18px;
            border: 1px solid #e1e8f3;
            box-shadow: 0 15px 40px #16315b24 !important;
        }
        .account-dropdown .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 11px;
            padding: 10px 12px !important;
            color: #31486a;
            font-size: .96rem;
            font-weight: 500;
            white-space: normal;
            transition: background .18s;
        }
        .account-dropdown .dropdown-item:hover { background: #edf3ff; color: #255bb7; }
        .account-menu-icon {
            display: grid;
            place-items: center;
            width: 35px;
            height: 35px;
            flex-shrink: 0;
            border-radius: 10px;
            background: #eef3fb;
            font-size: 1rem;
        }
        .account-menu-icon.logout-icon { background: #fff0ef; color: #c34646; font-size: 1.3rem; }
        .account-dropdown .dropdown-divider { margin: 8px 4px; border-color: #e1e8f3; }
        @media (prefers-reduced-motion: reduce) {
            .account-dropdown .dropdown-item { transition: none; }
        }

        .account-dropdown > .dropdown-menu {
            display: block;
            margin-top: 0;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(10px) scale(.97);
            transform-origin: top right;
            transition: opacity .2s ease, transform .2s ease, visibility .2s;
        }
        .account-dropdown > .dropdown-menu.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }
        .account-avatar {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 50%;
            vertical-align: middle;
        }
        @media (prefers-reduced-motion: reduce) {
            .account-dropdown > .dropdown-menu { transition: none; }
        }
        /* Hiển thị menu khi hover */
        .notif-dropdown:hover .dropdown-menu {
            display: block;
            margin-top: 0;
        }

        /* Hiệu ứng hover cho Navbar Links nổi bật hơn */
        .nav-hover {
            position: relative;
            transition: color 0.3s ease;
        }
        .nav-hover::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            bottom: -5px;
            left: 50%;
            background-color: #ffc107; /* Màu vàng nổi bật */
            transition: all 0.3s ease;
            transform: translateX(-50%);
            border-radius: 2px;
        }
        .nav-hover:hover::after {
            width: 80%;
        }
        .nav-hover:hover {
            color: #ffc107 !important; /* Chữ đổi màu vàng */
        }
    </style>
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 me-5" th:href="@{/}">
            <span class="student-brand-icon"><i class="bi bi-robot"></i></span><span>EngMasster</span>
        </a>
        <div sec:authorize="!isAuthenticated()" class="guest-auth-actions">
            <a th:href="@{/login}" class="guest-login-button">Đăng nhập</a>
            <a th:href="@{/register}" class="guest-register-button">Đăng ký</a>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto fw-semibold" style="gap: 15px;">
                <li class="nav-item">
                    <a class="nav-link text-white rounded px-3 transition-all nav-hover" th:href="@{/}"><i class="bi bi-house-door me-1"></i>Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white rounded px-3 transition-all nav-hover" th:href="@{/#courses}"><i class="bi bi-journal-text me-1"></i>Lộ trình</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white rounded px-3 transition-all nav-hover" th:href="@{/#teachers}"><i class="bi bi-people me-1"></i>Đội ngũ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white rounded px-3 transition-all nav-hover" th:href="@{/#commitments}"><i class="bi bi-shield-check me-1"></i>Cam kết</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white rounded px-3 transition-all nav-hover" th:href="@{/#offers}"><i class="bi bi-gift me-1"></i>Ưu đãi</a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <!-- Đã đăng nhập -->
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">

                    <!-- Nút chuông thông báo -->
                    <div class="dropdown me-3 notif-dropdown" onmouseenter="fetchNotifications()">
                        <a th:href="@{/notifications}" class="notification-button position-relative" id="notifMenu" aria-label="Xem thông báo">
                            <i class="bi bi-bell-fill" aria-hidden="true"></i>
                            <span id="notifBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">
                                0
                            </span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="notifMenu" id="notifList" style="width: 300px; max-height: 400px; overflow-y: auto;">
                            <li><span class="dropdown-item text-center text-muted">Đang tải...</span></li>
                        </ul>
                    </div>

                    <div class="dropdown account-dropdown">
                        <button class="btn btn-light dropdown-toggle fw-bold account-toggle" type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                            <img th:if="${accountAvatarUrl != null}" th:src="${accountAvatarUrl}" class="account-avatar me-1" alt="Ảnh đại diện" onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
                            <span th:hidden="${accountAvatarUrl != null}" aria-hidden="true">👤</span>
                            <span sec:authentication="name">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userMenu">
                            <li>
                                <a class="dropdown-item py-2" th:href="@{/profile}">
                                    <span class="account-menu-icon">📋</span><span>Thông tin tài khoản</span>
                                </a>
                            </li>
                            <li><a class="dropdown-item py-2" th:href="@{/profile/payments}"><span class="account-menu-icon">💳</span><span>Lịch sử thanh toán</span></a></li>
                            <li>
                                <a class="dropdown-item py-2" th:href="@{/profile/learning-history}">
                                    <span class="account-menu-icon">📊</span><span>Lịch sử học tập</span>
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item py-2 text-danger">
                                        <span class="account-menu-icon logout-icon">↪</span><span>Đăng xuất</span>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script sec:authorize="isAuthenticated()">
        function updateNotifBadge(count) {
            const badge = document.getElementById('notifBadge');
            if (count > 0) {
                badge.innerText = count;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        }

        function fetchNotifications() {
            fetch('/api/notifications')
                .then(res => res.json())
                .then(data => {
                    updateNotifBadge(data.unreadCount);
                    const list = document.getElementById('notifList');
                    list.innerHTML = '';

                    if (!data.notifications || data.notifications.length === 0) {
                        list.innerHTML = '<li><span class="dropdown-item text-center text-muted py-3">Không có thông báo mới</span></li>';
                    } else {
                        data.notifications.forEach(n => {
                            const li = document.createElement('li');
                            li.style.cursor = 'pointer';
                            li.className = n.isRead ? '' : 'bg-light';

                        const a = document.createElement('a');
                        a.className = 'dropdown-item border-bottom py-2';
                        // Keep text wrap inside dropdown
                        a.style.whiteSpace = 'normal';

                        // Bold title if unread
                        const titleStyle = n.isRead ? '' : 'fw-bold';
                        const dotHtml = n.isRead ? '' : '<span class="bg-danger rounded-circle d-inline-block me-2" style="width: 8px; height: 8px;"></span>';

                        a.innerHTML = `<div class="d-flex align-items-center mb-1"><div class="${titleStyle} text-primary" style="font-size: 0.9em;">${dotHtml}${n.title}</div></div>
                                       <div class="small text-muted">${n.message}</div>`;

                        a.href = '/api/notifications/' + n.id + '/read';

                        li.appendChild(a);
                        list.appendChild(li);
                    });
                    } // <-- close else block here

                    const viewAllLi = document.createElement('li');
                    viewAllLi.innerHTML = '<a class="dropdown-item text-center fw-bold text-primary py-2 border-top" href="/notifications">Xem tất cả thông báo</a>';
                    list.appendChild(viewAllLi);
                })
                .catch(err => console.error('Error fetching notifs:', err));
        }

        // Fetch on load to get badge count
        window.addEventListener('DOMContentLoaded', () => {
            fetch('/api/notifications')
                .then(res => res.json())
                .then(data => updateNotifBadge(data.unreadCount))
                .catch(e => console.error(e));
        });

        // Listen for new notifications from flashcard flip
        window.addEventListener('notification-received', () => {
            fetch('/api/notifications')
                .then(res => res.json())
                .then(data => updateNotifBadge(data.unreadCount))
                .catch(e => console.error(e));
        });
    </script>
</nav>

<!-- Bootstrap JS Bundle (bắt buộc cho dropdown hoạt động) -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
