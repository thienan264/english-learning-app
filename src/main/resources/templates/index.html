<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Trang chủ - English Learning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <!-- Navbar cho Học viên -->
<!-- Trỏ đến file navbar.html trong thư mục layout và lấy mảnh ghép có tên là main-navbar -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <div class="container">
        <div class="text-center mb-5">
            <h1 class="text-primary fw-bold">Hệ thống học Tiếng Anh 3 Kỹ Năng</h1>
            <p class="lead text-muted">Tích hợp chấm bài tự động bằng Trí tuệ nhân tạo (AI)</p>
        </div>

        <h3 class="mb-4 border-bottom pb-2">Các khóa học hiện có</h3>
        <div class="row">
            <!-- Vòng lặp hiển thị các Khóa học -->
            <div class="col-md-4 mb-4" th:each="course : ${courses}">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-body">
                        <span class="badge mb-2" 
                              th:classappend="${#strings.equalsIgnoreCase(course.level, 'Beginner') ? 'bg-success' : 
                                              (#strings.equalsIgnoreCase(course.level, 'Intermediate') ? 'bg-warning text-dark' : 
                                              (#strings.equalsIgnoreCase(course.level, 'Advanced') ? 'bg-danger' : 'bg-secondary'))}"
                              th:text="${course.level}"></span>
                        <h4 class="card-title fw-bold text-primary" th:text="${course.title}"></h4>
                        <p class="card-text text-muted mb-3" th:text="${course.description}"></p>
                        
                        <!-- Progress section (only shows if user is logged in & enrolled) -->
                        <div th:if="${course.isEnrolled}" class="mt-3 p-3 bg-light rounded border">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="small fw-bold text-secondary">Tiến trình tổng:</span>
                                <span class="small fw-bold text-primary" th:text="${course.completionPercentage} + '%'"></span>
                            </div>
                            <div class="progress mb-3" style="height: 8px;">
                                <div class="progress-bar bg-primary" role="progressbar" 
                                     th:style="'width: ' + ${course.completionPercentage} + '%'" 
                                     th:aria-valuenow="${course.completionPercentage}" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="small text-muted">Lý thuyết & Bài tập:</span>
                                <span class="small text-muted" th:text="${course.completedLessons} + ' / ' + ${course.totalLessons} + ' bài'"></span>
                            </div>
                            <div class="progress mb-3" style="height: 6px;">
                                <div class="progress-bar bg-success" role="progressbar" 
                                     th:style="'width: ' + (${course.totalLessons > 0 ? (course.completedLessons * 100.0 / course.totalLessons) : 0}) + '%'" 
                                     th:aria-valuenow="${course.completedLessons}" aria-valuemin="0" th:aria-valuemax="${course.totalLessons}"></div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="small text-muted">Bộ từ vựng:</span>
                                <span class="small text-muted" th:text="${course.completedFlashcards} + ' / ' + ${course.totalFlashcards} + ' từ'"></span>
                            </div>
                            <div class="progress" style="height: 6px;">
                                <div class="progress-bar bg-info" role="progressbar" 
                                     th:style="'width: ' + (${course.totalFlashcards > 0 ? (course.completedFlashcards * 100.0 / course.totalFlashcards) : 0}) + '%'" 
                                     th:aria-valuenow="${course.completedFlashcards}" aria-valuemin="0" th:aria-valuemax="${course.totalFlashcards}"></div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0 pb-3">
                        <a th:href="@{'/courses/' + ${course.id}}" 
                           class="btn w-100 fw-bold"
                           th:classappend="${course.isEnrolled ? 'btn-primary' : 'btn-outline-primary'}"
                           th:text="${course.isEnrolled ? 'Tiếp tục học' : 'Vào học ngay'}">
                        </a>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(courses)}" class="col-12 text-center text-muted">
                Hệ thống đang cập nhật khóa học, vui lòng quay lại sau!
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
