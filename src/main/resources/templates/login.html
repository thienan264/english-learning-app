<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<!-- Page Transition Effect -->
<div th:replace="~{layout/page-transition :: transition}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Đăng Nhập</h3>
                    
                    <div th:if="${param.registered}" class="alert alert-success" role="alert">
                        Đăng ký thành công! Hãy đăng nhập.
                    </div>
                    <div th:if="${param.passwordChanged}" class="alert alert-success" role="alert">
                        Đổi mật khẩu thành công! Hãy đăng nhập lại.
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        Tên đăng nhập hoặc mật khẩu không đúng.
                    </div>
                    
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Tên đăng nhập</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Đăng Nhập</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a th:href="@{/register}" class="text-decoration-none d-block mb-2">Chưa có tài khoản? Đăng ký ngay</a>
                        <a th:href="@{/}" class="text-decoration-none text-muted">Về trang chủ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
