<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Kết quả làm bài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/readability.css}">
<meta th:if="${_csrf != null}" name="study-csrf" th:content="${_csrf.token}"><script defer th:src="@{/js/study-activity.js}"></script><th:block th:replace="~{layout/page-transition :: transition}"></th:block>
</head>

<body class="bg-light text-center">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-success">
                    <div class="card-body py-5">
                        <h1 class="display-1 text-success fw-bold" th:text="${result.score}"></h1>

                        <h3 class="text-secondary mt-3">IELTS Band Score</h3>
                        <hr>
                        <p class="fs-5">Bài thi: <strong th:text="${lesson.title}"></strong></p>
                        <p class="fs-5">Số câu đúng: <strong
                                th:text="${result.correctAnswers} + ' / ' + ${result.totalQuestions}"></strong></p>
                        <a href="/" class="btn btn-primary mt-4">Về trang chủ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
