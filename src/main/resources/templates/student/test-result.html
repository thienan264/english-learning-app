<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết quả làm bài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-center">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-success">
                    <div class="card-body py-5">
                        <h1 class="display-1 text-success fw-bold" th:text="${result.score}"></h1>
                        <h3 class="text-secondary mt-3">Điểm của bạn</h3>
                        <hr>
                        <p class="fs-5">Bài thi: <strong th:text="${lesson.title}"></strong></p>
                        <p class="fs-5">Số câu đúng: <strong th:text="${result.correctAnswers} + ' / ' + ${result.totalQuestions}"></strong></p>
                        <a href="/" class="btn btn-primary mt-4">Về trang chủ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
