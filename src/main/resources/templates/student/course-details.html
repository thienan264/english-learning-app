<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar (Thêm thanh menu nếu cần) -->
    
    <div class="container mt-5 mb-5" style="max-width: 800px;">
        <a href="/" class="btn btn-secondary mb-4">&larr; Về trang chủ</a>
        
        <!-- Course Header -->
        <div class="card shadow border-0 rounded-4 overflow-hidden mb-4">
            <div class="bg-primary text-white p-5 text-center">
                <h1 class="fw-bold display-5 mb-3" th:text="${course.title}"></h1>
                <p class="fs-5 opacity-75" th:text="${course.description}"></p>
                <div class="mt-4">
                    <span class="badge bg-light text-primary fs-6 me-2" th:if="${course.level != null}" th:text="'Trình độ: ' + ${course.level}"></span>
                    <span class="badge bg-warning text-dark fs-6" th:if="${course.targetBandMax != null}" th:text="'Mục tiêu: ' + ${course.targetBandMin} + ' - ' + ${course.targetBandMax}"></span>
                </div>
            </div>
            
            <div class="card-body p-5 text-center bg-white">
                <h3 class="mb-4 fw-bold text-dark">Bạn đã sẵn sàng chinh phục khóa học này?</h3>
                <p class="text-muted mb-4 fs-5">Khóa học được thiết kế theo lộ trình chuẩn. Hệ thống sẽ lưu lại tiến độ học tập của bạn.</p>
                
                <th:block th:if="${isEnrolled}">
                    <a th:if="${!isExpired}" th:href="@{'/learn/course/' + ${course.id}}" class="btn btn-primary btn-lg px-5 py-3 fs-4 fw-bold shadow rounded-pill w-100 mb-3">
                        🚀 TIẾP TỤC HỌC
                    </a>
                    <form th:if="${isExpired}" th:action="@{'/payment/checkout/' + ${course.id}}" method="post">
                        <button type="submit" class="btn btn-warning btn-lg px-5 py-3 fs-4 fw-bold shadow rounded-pill w-100 mb-3">
                            <i class="bi bi-arrow-clockwise me-2"></i>GIA HẠN NGAY (<span th:text="${#numbers.formatDecimal(course.salePrice != null ? course.salePrice : course.price, 0, 'COMMA', 0, 'POINT')}"></span> đ)
                        </button>
                    </form>
                </th:block>
                
                <div th:unless="${isEnrolled}">
                    <a th:if="${course.isFree == null or course.isFree}" th:href="@{'/learn/course/' + ${course.id}}" class="btn btn-primary btn-lg px-5 py-3 fs-4 fw-bold shadow rounded-pill w-100 mb-3">
                        🚀 VÀO HỌC NGAY (Miễn phí)
                    </a>
                    <div th:if="${course.salePrice != null}" class="mb-4 d-flex justify-content-center">
                        <div th:if="${course.saleEndDate != null}" class="sale-countdown-container text-danger fw-bold fs-5 p-3 rounded d-inline-flex align-items-center w-100 justify-content-center" style="background: rgba(220, 53, 69, 0.1); border: 2px dashed #dc3545;" th:data-sale-end="${#temporals.format(course.saleEndDate, 'yyyy-MM-dd''T''HH:mm:ss')}">
                            <i class="bi bi-stopwatch me-2 fs-3 pulse-animation"></i>
                            <span>Khuyến mãi kết thúc sau: <span class="countdown-timer ms-2">Đang tính...</span></span>
                        </div>
                        <div th:if="${course.saleEndDate == null}" class="text-danger fw-bold fs-5 p-3 rounded d-inline-flex align-items-center w-100 justify-content-center" style="background: rgba(220, 53, 69, 0.1); border: 2px dashed #dc3545;">
                            <i class="bi bi-stopwatch me-2 fs-3 pulse-animation"></i>
                            <span>Ưu đãi có giới hạn! Mua ngay!</span>
                        </div>
                    </div>

                    
                    <form th:if="${course.isFree != null and !course.isFree}" th:action="@{'/payment/checkout/' + ${course.id}}" method="post">
                        <button type="submit" class="btn btn-danger btn-lg px-5 py-3 fs-4 fw-bold shadow rounded-pill w-100 mb-3">
                            <i class="bi bi-cart-fill me-2"></i>MUA KHÓA HỌC 
                            (<span th:if="${course.salePrice != null}" class="text-decoration-line-through me-2 text-white-50 fs-6" th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            <span th:text="${#numbers.formatDecimal(course.salePrice != null ? course.salePrice : course.price, 0, 'COMMA', 0, 'POINT')}"></span> đ)
                        </button>
                    </form>
                </div>
                
                <a th:if="${!isExpired}" th:href="@{'/courses/' + ${course.id} + '/study-flashcards'}" class="btn btn-outline-success btn-lg px-5 py-2 fw-bold rounded-pill w-100">
                    🃏 Học Bộ Từ Vựng (Flashcards)
                </a>
            </div>
        </div>
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const countdownElements = document.querySelectorAll('.sale-countdown-container');
            
            function updateCountdowns() {
                const now = new Date().getTime();
                
                countdownElements.forEach(container => {
                    const saleEndStr = container.getAttribute('data-sale-end');
                    if (!saleEndStr) return;
                    
                    const endDate = new Date(saleEndStr).getTime();
                    const distance = endDate - now;
                    
                    const timerDisplay = container.querySelector('.countdown-timer');
                    if (!timerDisplay) return;
                    
                    if (distance < 0) {
                        timerDisplay.innerHTML = "Đã kết thúc";
                        container.classList.add('opacity-50');
                        const pulse = container.querySelector('.pulse-animation');
                        if (pulse) pulse.classList.remove('pulse-animation');
                    } else {
                        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                        
                        let text = "";
                        if (days > 0) text += days + " ngày ";
                        text += (hours < 10 ? "0" + hours : hours) + "h ";
                        text += (minutes < 10 ? "0" + minutes : minutes) + "m ";
                        text += (seconds < 10 ? "0" + seconds : seconds) + "s";
                        
                        timerDisplay.innerHTML = text;
                    }
                });
            }
            
            if (countdownElements.length > 0) {
                updateCountdowns();
                setInterval(updateCountdowns, 1000);
            }
        });
    </script>
    <style>
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pulse-animation {
            animation: pulse 1s infinite;
        }
    </style>
</body>
</html>
