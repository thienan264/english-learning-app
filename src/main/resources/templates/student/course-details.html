<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <a href="/" class="btn btn-secondary mb-4">&larr; Về trang chủ</a>
        
        <div class="card shadow border-primary mb-4">
            <div class="card-body">
                <h2 class="text-primary fw-bold" th:text="${course.title}"></h2>
                <p class="text-muted fs-5" th:text="${course.description}"></p>
                
                <!-- Nút chuyển sang học Flashcard -->
                <a th:href="@{'/courses/' + ${course.id} + '/study-flashcards'}" class="btn btn-success mt-2">
                    🃏 Học Từ Vựng (Flashcards)
                </a>
            </div>
        </div>

        <h4 class="mb-3 fw-bold">Danh sách Bài học</h4>
        <div class="list-group shadow-sm">
            <div th:each="lesson : ${lessons}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                <div>
                    <h5 class="mb-1 fw-bold" th:text="${lesson.title}"></h5>
                    <span class="badge bg-info text-dark" th:text="${lesson.skillType}"></span>
                </div>
                
                <!-- Logic dẫn link tùy theo Kỹ năng -->
                <div>
                    <a th:if="${lesson.skillType == 'WRITING'}" th:href="@{'/lessons/' + ${lesson.id} + '/writing'}" class="btn btn-primary">Làm bài Viết (AI Chấm)</a>
                    
                    <a th:if="${lesson.skillType == 'READING' or lesson.skillType == 'LISTENING'}" th:href="@{'/lessons/' + ${lesson.id}}" class="btn btn-outline-primary">Làm bài Trắc nghiệm</a>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(lessons)}" class="list-group-item text-center text-muted py-4">
                Khóa học này chưa có bài học nào.
            </div>
        </div>
    </div>
</body>
</html>
