<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Kết Quả</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .result-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 30px; margin-top: 30px; }
        .question-card { background: white; border: 1px solid #e9ecef; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .correct-ans { background-color: #d1e7dd; border-left: 4px solid #198754; }
        .wrong-ans { background-color: #f8d7da; border-left: 4px solid #dc3545; }
        .score-circle { width: 120px; height: 120px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto; border: 5px solid; }
        .score-circle.success { border-color: #198754; color: #198754; }
        .score-circle.danger { border-color: #dc3545; color: #dc3545; }
    </style>
</head>
<body>
    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="mt-4 mb-3 d-flex justify-content-between align-items-center">
                    <a th:href="@{'/learn/course/' + ${lesson.module.course.id}}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Quay lại khóa học
                    </a>
                    <h4 class="fw-bold m-0" th:text="${lesson.title}"></h4>
                </div>

                <!-- Summary Card -->
                <div class="result-card text-center mb-4">
                    <h2 class="fw-bold mb-4">Kết Quả Làm Bài</h2>
                    
                    <div class="row align-items-center">
                        <div class="col-md-4 mb-3">
                            <div class="text-muted mb-1">Thời gian nộp</div>
                            <h5 th:text="${#temporals.format(result.completedAt, 'dd/MM/yyyy HH:mm')}"></h5>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="score-circle" th:classappend="${result.score >= lesson.passScore ? 'success' : 'danger'}">
                                <span class="fs-1 fw-bold" th:text="${result.score}"></span>
                                <span class="fs-6 text-muted">Điểm</span>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="text-muted mb-1">Số câu đúng</div>
                            <h5 th:text="${result.correctAnswers} + ' / ' + ${result.totalQuestions}"></h5>
                        </div>
                    </div>
                </div>

                <!-- Detailed Answers -->
                <h4 class="fw-bold mb-3" th:if="${detailedAnswers != null}">Chi tiết câu trả lời</h4>
                
                <div th:if="${detailedAnswers == null}" class="alert alert-warning">
                    Không có dữ liệu chi tiết cho bài làm này (bài thi được làm trước khi tính năng lưu chi tiết được bật).
                </div>

                <div th:if="${detailedAnswers != null}">
                    <div th:each="ans, stat : ${detailedAnswers}" class="question-card" th:classappend="${ans.isCorrect ? 'correct-ans' : 'wrong-ans'}">
                        
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="m-0 fw-bold">Câu <span th:text="${stat.count}"></span></h5>
                            <span class="badge rounded-pill fs-6" th:classappend="${ans.isCorrect ? 'bg-success' : 'bg-danger'}">
                                <i class="bi" th:classappend="${ans.isCorrect ? 'bi-check-circle' : 'bi-x-circle'}"></i> 
                                <span th:text="${ans.isCorrect ? 'Đúng' : 'Sai'}"></span>
                            </span>
                        </div>
                        
                        <div class="mb-3" th:utext="${ans.questionText}"></div>
                        
                        <div class="row mt-3">
                            <div class="col-md-6 mb-2">
                                <div class="text-muted small mb-1">Câu trả lời của bạn:</div>
                                <div class="p-2 bg-light rounded border fw-bold" th:classappend="${ans.isCorrect ? 'text-success' : 'text-danger'}">
                                    <span th:if="${ans.submittedValue == null || ans.submittedValue == ''}" class="text-muted fst-italic">Không trả lời</span>
                                    <span th:if="${ans.submittedValue != null && ans.submittedValue != ''}" th:text="${ans.submittedValue}"></span>
                                </div>
                            </div>
                            <div class="col-md-6 mb-2">
                                <div class="text-muted small mb-1">Đáp án đúng:</div>
                                <div class="p-2 bg-light rounded border fw-bold text-success" th:text="${ans.correctAnswer}">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Giải thích -->
                        <div th:if="${ans.explanation != null && ans.explanation != ''}" class="mt-3 p-3 bg-light border rounded">
                            <span class="fw-bold text-primary"><i class="bi bi-lightbulb-fill me-1"></i>Giải thích:</span>
                            <div class="mt-2" th:utext="${ans.explanation}"></div>
                        </div>
                        
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
