<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết quả AI chấm điểm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow border-success mb-5">
            <div class="card-body text-center py-4">
                <h3 class="text-secondary mb-3">Kết quả AI Đánh giá (Thang điểm IELTS)</h3>
                <h1 class="display-1 text-success fw-bold" th:text="${submission.bandScore}"></h1>
                <hr>
                
                <div class="text-start mt-4 px-3">
                    <h5 class="fw-bold text-primary">📝 Nhận xét chi tiết từ AI:</h5>
                    <div class="alert alert-info mt-2" style="white-space: pre-wrap;" th:text="${submission.feedback}"></div>
                    
                    <h5 class="fw-bold mt-4">📄 Bài làm của bạn:</h5>
                    <div class="p-3 bg-white border rounded text-muted mb-4" style="white-space: pre-wrap;" th:text="${submission.submissionText}"></div>

                    <h5 class="fw-bold text-success">💡 Bài viết gợi ý nâng cấp (+1.0 Band):</h5>
                    <div class="p-4 bg-light border border-success rounded text-dark fs-5" style="white-space: pre-wrap; line-height: 1.6;" th:text="${submission.suggestedEssay}"></div>
                </div>
                
                <a href="/" class="btn btn-primary mt-4 px-5">Quay lại trang chủ</a>
            </div>
        </div>
    </div>
</body>
</html>
