<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" th:content="${_csrf.token}" th:if="${_csrf != null}"/>
    <meta name="csrf-header" th:content="${_csrf.headerName}" th:if="${_csrf != null}"/>
    
    <title>Học Từ Vựng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .scene {
            width: 100%;
            height: 250px;
            perspective: 600px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .card-flip {
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
        }

        .card-flip.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            padding: 20px;
            text-align: center;
        }

        .card-front {
            background-color: #ffffff;
            border: 2px solid #0d6efd;
        }

        .card-back {
            background-color: #0d6efd;
            color: white;
            transform: rotateY(180deg);
        }
    </style>
</head>

<body class="bg-light">
    <!-- Trỏ đến file navbar.html trong thư mục layout -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div class="text-center mb-4">
            <h2 class="text-primary">Bộ từ vựng: <span th:text="${course.title}"></span></h2>
            <p class="text-muted">Nhấp vào từng thẻ để xem nghĩa tiếng Việt</p>
            <a th:href="@{'/courses/' + ${course.id}}" class="btn btn-outline-secondary mt-2">Về khóa học</a>
        </div>

        <div class="row" id="flashcard-container">
            <div class="col-md-4 col-sm-6" th:each="fc : ${flashcards}">
                <div class="scene" th:onclick="'flipCard(this, ' + ${fc.id} + ')'" th:data-flipped="${flippedMap != null && flippedMap[fc.id] == true ? 'true' : 'false'}">
                    <div class="card-flip" th:classappend="${flippedMap != null && flippedMap[fc.id] == true ? 'is-flipped' : ''}">
                        <!-- Mặt trước -->
                        <div class="card-face card-front">
                            <h3 class="fw-bold text-primary mb-2" th:text="${fc.word}"></h3>
                            <span class="text-muted fst-italic mb-3" th:text="${fc.phonetic}"></span>

                            <button class="btn btn-outline-primary rounded-circle"
                                style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;"
                                th:onclick="playSound(event, [[${fc.word}]])" title="Nghe phát âm">
                                🔊
                            </button>
                        </div>
                        <!-- Mặt sau -->
                        <div class="card-face card-back">
                            <h4 class="fw-bold mb-3" th:text="${fc.meaning}"></h4>
                            <p class="fst-italic mb-0" th:if="${fc.exampleSentence != null}"
                                th:text="${fc.exampleSentence}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Nút chuyển sang kiểm tra, ẩn đi nếu chưa học xong -->
        <div class="text-center mt-5 mb-5" id="quiz-section" th:style="${allCompleted ? 'display: block;' : 'display: none;'}">
            <hr>
            <h4 class="text-success fw-bold mb-3">🎉 Chúc mừng bạn đã hoàn thành bộ từ vựng!</h4>
            <a th:href="@{'/courses/' + ${course.id} + '/vocabulary-quiz'}" class="btn btn-lg btn-success shadow-sm">
                Chuyển sang kiểm tra từ vựng ➔
            </a>
        </div>

        <div th:if="${#lists.isEmpty(flashcards)}" class="alert alert-warning text-center">
            Khóa học này hiện chưa có từ vựng nào.
        </div>
    </div>
    
    <!-- Âm thanh lật thẻ và hoàn thành -->
    <audio id="audioFlip" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
    <audio id="audioUnlock" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const audioFlip = document.getElementById('audioFlip');
        const audioUnlock = document.getElementById('audioUnlock');
        let allCompleted = [[${allCompleted == true}]];

        function flipCard(element, flashcardId) {
            const cardFlip = element.querySelector('.card-flip');
            cardFlip.classList.toggle('is-flipped');
            
            // Play flip sound
            audioFlip.currentTime = 0;
            audioFlip.play().catch(e => console.log('Audio play error:', e));

            const isFlippedNow = element.getAttribute('data-flipped') === 'true';
            
            // Only send API request if it hasn't been flipped yet
            if (!isFlippedNow) {
                element.setAttribute('data-flipped', 'true');
                
                // Get CSRF tokens if available
                const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content;
                const csrfHeader = document.querySelector('meta[name="csrf-header"]')?.content;
                
                const headers = {
                    'Content-Type': 'application/json'
                };
                if (csrfToken && csrfHeader) {
                    headers[csrfHeader] = csrfToken;
                }

                fetch('/api/flashcards/' + flashcardId + '/flip', {
                    method: 'POST',
                    headers: headers
                })
                .then(response => response.json())
                .then(data => {
                    if (data.allCompleted && !allCompleted) {
                        allCompleted = true;
                        // Play unlock sound
                        audioUnlock.currentTime = 0;
                        audioUnlock.play().catch(e => console.log('Audio play error:', e));
                        
                        // Show the quiz button
                        document.getElementById('quiz-section').style.display = 'block';
                        
                        // Scroll to the bottom
                        setTimeout(() => {
                            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                        }, 500);
                        
                        // Optionally trigger a custom event that navbar could listen to to update bell icon immediately
                        window.dispatchEvent(new CustomEvent('notification-received'));
                    }
                })
                .catch(err => console.error('Error recording flip:', err));
            }
        }

        function playSound(event, textToSpeak) {
            event.stopPropagation();
            if ('speechSynthesis' in window) {
                var speech = new SpeechSynthesisUtterance(textToSpeak);
                speech.lang = 'en-US';
                speech.rate = 0.9;
                window.speechSynthesis.speak(speech);
            } else {
                alert("Trình duyệt của bạn quá cũ, không hỗ trợ tính năng đọc tự động.");
            }
        }
    </script>
</body>
</html>
