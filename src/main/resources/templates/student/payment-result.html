<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết quả thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div th:replace="~{layout/page-transition :: transition}"></div>
    
    <div class="card shadow-lg border-0 text-center p-5" style="max-width: 500px;">
        <div th:if="${status == 'success'}">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
            <h2 class="fw-bold mt-3 text-success">Thanh toán thành công!</h2>
            <p class="text-muted mt-2" th:text="${message}"></p>
            <a href="/" class="btn btn-success btn-lg mt-4 w-100 rounded-pill">Vào học ngay</a>
        </div>
        <div th:if="${status == 'failed'}">
            <i class="bi bi-x-circle-fill text-danger" style="font-size: 5rem;"></i>
            <h2 class="fw-bold mt-3 text-danger">Thanh toán thất bại</h2>
            <p class="text-muted mt-2" th:text="${message}"></p>
            <a href="/" class="btn btn-outline-danger btn-lg mt-4 w-100 rounded-pill">Về trang chủ</a>
        </div>
    </div>
</body>
</html>
