<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" th:content="${_csrf.token}" th:if="${_csrf != null}"/>
    <meta name="csrf-header" th:content="${_csrf.headerName}" th:if="${_csrf != null}"/>
    
    <title>Tất cả thông báo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h4 class="mb-0 fw-bold text-primary">Thông báo của bạn</h4>
                        <span class="badge bg-danger rounded-pill" th:text="${unreadCount} + ' chưa đọc'"></span>
                    </div>
                    <div class="card-body p-0">
                        <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5 text-muted">
                            <i class="bi bi-bell-slash" style="font-size: 3rem;"></i>
                            <p class="mt-3">Bạn chưa có thông báo nào.</p>
                        </div>
                        
                        <div class="list-group list-group-flush" th:if="${not #lists.isEmpty(notifications)}">
                            <a th:each="n : ${notifications}" 
                               th:href="@{/api/notifications/{id}/read(id=${n.id})}" 
                               class="list-group-item list-group-item-action p-4 border-bottom"
                               th:classappend="${n.isRead == true} ? '' : 'bg-light'">
                               
                               <div class="d-flex w-100 justify-content-between mb-2">
                                   <div class="d-flex align-items-center">
                                       <span th:if="${n.isRead != true}" class="bg-primary rounded-circle d-inline-block me-2" style="width: 10px; height: 10px; flex-shrink: 0;" title="Chưa đọc"></span>
                                       <h6 class="mb-0 text-primary" th:classappend="${n.isRead == true} ? '' : 'fw-bold'" th:text="${n.title}"></h6>
                                   </div>
                                   <small class="text-muted ms-2 text-nowrap" th:text="${n.createdAt != null ? #temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm') : ''}"></small>
                               </div>
                               <p class="mb-1" th:classappend="${n.isRead == true} ? 'text-muted' : 'text-dark'" th:text="${n.message}"></p>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
