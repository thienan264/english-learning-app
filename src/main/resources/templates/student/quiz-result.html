<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Kết quả Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link rel="stylesheet" th:href="@{/css/readability.css}">
<meta th:if="${_csrf != null}" name="study-csrf" th:content="${_csrf.token}"><script defer th:src="@{/js/study-activity.js}"></script><th:block th:replace="~{layout/page-transition :: transition}"></th:block>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    
    <div class="card shadow-lg border-0" style="width: 100%; max-width: 500px; border-radius: 15px;">
        <div class="card-body p-5 text-center">
            
            <div th:if="${passed}">
                <i class="bi bi-trophy-fill text-warning mb-3" style="font-size: 5rem;"></i>
                <h2 class="fw-bold text-success">Passed!</h2>
            </div>
            
            <div th:if="${!passed}">
                <i class="bi bi-x-circle-fill text-danger mb-3" style="font-size: 5rem;"></i>
                <h2 class="fw-bold text-danger">Failed</h2>
            </div>
            
            <h4 class="mb-2">Điểm của bạn: <span th:text="${score} + '/10'"></span></h4>
            <p class="text-muted">Đúng <span th:text="${correctAnswers}"></span>/<span th:text="${totalQuestions}"></span> câu</p>
            
            <div class="alert mt-4" th:classappend="${passed ? 'alert-success' : 'alert-danger'}" th:text="${message}"></div>

            <div class="mt-4 d-flex justify-content-center gap-3">
                <a th:href="@{'/lessons/' + ${lesson.id} + '/take'}" class="btn btn-outline-secondary">Làm lại</a>
                <a th:href="@{'/learn/course/' + ${lesson.module.course.id}}" class="btn btn-primary">Trở về Khóa học</a>
            </div>
            
        </div>
    </div>

</body>
</html>
