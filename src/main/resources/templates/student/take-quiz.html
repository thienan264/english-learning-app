<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Làm bài Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .question-card { border-left: 5px solid #0d6efd; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .question-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }
        .form-check-label { cursor: pointer; display: block; padding: 10px; border: 1px solid #dee2e6; border-radius: 5px; transition: all 0.2s; }
        .form-check-input:checked + .form-check-label { background-color: #e7f1ff; border-color: #0d6efd; font-weight: bold; }
    </style>
<link rel="stylesheet" th:href="@{/css/readability.css}">
<meta th:if="${_csrf != null}" name="study-csrf" th:content="${_csrf.token}"><script defer th:src="@{/js/study-activity.js}"></script><th:block th:replace="~{layout/page-transition :: transition}"></th:block>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Bài tập trắc nghiệm: <span th:text="${lesson.title}"></span></span>
            <a th:href="@{'/learn/course/' + ${lesson.module.course.id}}" class="btn btn-outline-light btn-sm">Thoát</a>
        </div>
    </nav>

    <div class="container mt-5 mb-5" style="max-width: 800px;">
        <form th:action="@{'/lessons/' + ${lesson.id} + '/submit-quiz'}" method="post">
            
            <div th:each="q, iterStat : ${questions}" class="card question-card">
                <div class="card-body p-4">
                    <div class="question-text">
                        <span th:text="'Câu ' + ${iterStat.count} + ': '"></span>
                        <span th:text="${q.questionText}"></span>
                    </div>

                    <!-- Multiple Choice -->
                    <div th:if="${q.questionType == 'MULTIPLE_CHOICE' || q.questionType == 'MULTIPLE_CHOICE_SINGLE' || q.questionType == null}">
                        <div class="form-check mb-2" th:each="ans : ${q.answers}">
                            <input class="form-check-input d-none" type="radio" 
                                   th:name="'question_' + ${q.id}" th:id="'ans_' + ${ans.id}" th:value="${ans.id}" required>
                            <label class="form-check-label" th:for="'ans_' + ${ans.id}" th:text="${ans.answerText}"></label>
                        </div>
                    </div>

                    <!-- True/False/Not Given -->
                    <div th:if="${q.questionType == 'TRUE_FALSE_NOT_GIVEN'}">
                        <select class="form-select" th:name="'question_' + ${q.id}" required>
                            <option value="">-- Chọn đáp án --</option>
                            <option value="TRUE">TRUE (Đúng)</option>
                            <option value="FALSE">FALSE (Sai)</option>
                            <option value="NOT_GIVEN">NOT GIVEN (Không có thông tin)</option>
                        </select>
                    </div>

                    <!-- Fill in the blank -->
                    <div th:if="${q.questionType == 'FILL_IN_THE_BLANK'}">
                        <input type="text" class="form-control" th:name="'question_' + ${q.id}" placeholder="Nhập đáp án của bạn vào đây..." required>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(questions)}" class="alert alert-warning text-center">
                Bài tập này chưa có câu hỏi nào.
            </div>

            <div th:if="${!#lists.isEmpty(questions)}" class="text-center mt-5">
                <button type="submit" class="btn btn-primary btn-lg px-5 py-3 shadow-sm fw-bold">
                    <i class="bi bi-send-check"></i> NỘP BÀI
                </button>
            </div>
            
        </form>
    </div>

</body>
</html>
